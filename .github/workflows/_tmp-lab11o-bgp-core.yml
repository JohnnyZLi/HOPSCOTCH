name: Temp Lab 11O BGP Core

on:
  push:
    branches: [agent/lab-11o-bgp-core]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lab-11o-bgp-core
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/_tmp_write_bgp_core.py
      - run: python3 scripts/_tmp_patch_bgp_core.py
      - run: npm ci
      - run: npm run check
      - run: npm run performance:check
      - run: npm run compatibility:chrome
      - name: Commit validated BGP core
        env:
          BRANCH: agent/lab-11o-bgp-core
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/builder/bgp.ts src/BuilderBgpPanel.tsx src/builder/routing.ts src/internet/asModel.ts src/NetworkBuilder.tsx scripts/builder-bgp-contract-check.mjs package.json docs/ROADMAP.md docs/LAB11O.md
          git rm scripts/_tmp_write_bgp_core.py scripts/_tmp_patch_bgp_core.py .github/workflows/_tmp-lab11o-bgp-core.yml
          git commit -m 'Lab 11O: add Builder BGP core and policy [lab11o-bgp-core-finalized]'
          git push origin HEAD:$BRANCH
