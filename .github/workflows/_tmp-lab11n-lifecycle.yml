name: Temp Lab 11N Lifecycle

on:
  push:
    branches: [agent/lab-11n-ipv6-depth]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lab-11n-ipv6-depth
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/_tmp_write_ipv6_lifecycle.py
      - run: python3 scripts/_tmp_patch_ipv6_lifecycle_integration.py
      - run: npm ci
      - run: npm run check
      - run: npm run performance:check
      - run: npm run compatibility:chrome
      - name: Commit validated lifecycle implementation
        env:
          BRANCH: agent/lab-11n-ipv6-depth
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/BuilderIpv6LifecyclePanel.tsx src/BuilderIpv6Panel.tsx src/NetworkBuilder.tsx src/builder/ipv6-lifecycle.ts src/builder/ipv6.ts scripts/builder-ipv6-lifecycle-contract-check.mjs package.json docs/ROADMAP.md docs/LAB11N.md
          git rm scripts/_tmp_write_ipv6_lifecycle.py scripts/_tmp_patch_ipv6_lifecycle_integration.py .github/workflows/_tmp-lab11n-lifecycle.yml
          git commit -m 'Lab 11N: add IPv6 lifecycle and DHCPv6 depth [lab11n-lifecycle-finalized]'
          git push origin HEAD:$BRANCH
