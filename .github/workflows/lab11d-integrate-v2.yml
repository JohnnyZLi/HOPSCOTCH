name: Lab 11D active probes integration v2

on:
  push:
    branches:
      - agent/lab-11def-builder-probes-switching-vlans

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ github.event.head_commit.message != 'Implement Lab 11D active probes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lab-11def-builder-probes-switching-vlans
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply corrected Lab 11D
        run: |
          sed -n '/      - name: Apply Lab 11D/,/      - name: Commit Lab 11D/p' .github/workflows/lab11d-integrate.yml \
            | sed '1,2d;$d;s/^          //' > /tmp/apply-lab11d.sh
          sed -i "s/'10.0.0.9'/'10.0.0.10'/g; s/'10.0.0.17'/'10.0.0.18'/g" /tmp/apply-lab11d.sh
          bash /tmp/apply-lab11d.sh
      - name: Commit Lab 11D
        run: |
          rm .github/workflows/lab11d-integrate.yml .github/workflows/lab11d-integrate-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Lab 11D active probes"
          git push origin HEAD:agent/lab-11def-builder-probes-switching-vlans
