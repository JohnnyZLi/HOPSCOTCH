name: Temp Lab 11N Browser Apply

on:
  push:
    branches: [agent/lab-11n-ipv6-foundation]

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[lab11n-browser-applied]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lab-11n-ipv6-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/_tmp_fix_lab11n_browser_driver.py
      - run: python3 scripts/_tmp_apply_lab11n_browser.py
      - run: npm ci
      - run: npm run check
      - run: npm run performance:check
      - run: npm run compatibility:chrome
      - name: Commit browser contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts
          git commit -m "Lab 11N: add IPv6 browser contract [lab11n-browser-applied]"
          git push origin HEAD:agent/lab-11n-ipv6-foundation
