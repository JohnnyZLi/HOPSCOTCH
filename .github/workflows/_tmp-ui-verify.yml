name: Temp UI Verify

on:
  push:
    branches:
      - fix/ui-audit-responsive
    paths:
      - .github/workflows/_tmp-ui-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/ui-audit-responsive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start production preview
        run: |
          nohup npm exec vite preview -- --host 127.0.0.1 --port 4173 > /tmp/hopscotch-preview.log 2>&1 &
          for i in {1..50}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 0.2
          done
          cat /tmp/hopscotch-preview.log
          exit 1
      - name: Capture repaired UI
        shell: bash
        run: |
          cat > /tmp/ui-verify.mjs <<'NODE'
          import { spawn, spawnSync } from 'node:child_process';
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
          const which=(n)=>{const r=spawnSync('which',[n],{encoding:'utf8'});return r.status===0?r.stdout.trim():null};
          const chromePath=which('google-chrome-stable')||which('google-chrome')||which('chromium');
          if(!chromePath) throw new Error('Chrome not found');
          const port=9334; const chrome=spawn(chromePath,['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-background-networking','--disable-extensions','--mute-audio',`--remote-debugging-port=${port}`,'--remote-debugging-address=127.0.0.1','--remote-allow-origins=*','about:blank'],{stdio:['ignore','ignore','pipe']});
          let version;for(let i=0;i<80;i++){try{const r=await fetch(`http://127.0.0.1:${port}/json/version`);if(r.ok){version=await r.json();break}}catch{}await sleep(100)}if(!version)throw new Error('CDP not ready');
          const tabs=await(await fetch(`http://127.0.0.1:${port}/json/list`)).json();const target=tabs.find(t=>t.type==='page');
          class CDP{constructor(url){this.ws=new WebSocket(url);this.id=0;this.p=new Map();this.ready=new Promise((res,rej)=>{this.ws.addEventListener('open',res,{once:true});this.ws.addEventListener('error',rej,{once:true})});this.ws.addEventListener('message',async m=>{const raw=typeof m.data==='string'?m.data:Buffer.from(await m.data.arrayBuffer()).toString('utf8');const x=JSON.parse(raw);if(x.id){const q=this.p.get(x.id);if(!q)return;this.p.delete(x.id);x.error?q.reject(new Error(x.error.message)):q.resolve(x.result||{})}})}async call(method,params={}){await this.ready;const id=++this.id;const pr=new Promise((resolve,reject)=>this.p.set(id,{resolve,reject}));this.ws.send(JSON.stringify({id,method,params}));return pr}async eval(expression){const r=await this.call('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text);return r.result?.value}}
          const c=new CDP(target.webSocketDebuggerUrl);await c.ready;await c.call('Page.enable');await c.call('Runtime.enable');
          const routes={overview:'/',http:'/labs/http2-vs-http3',packet:'/labs/packet',tcp:'/labs/tcp',dns:'/labs/dns',tls:'/labs/tls',builder:'/labs/builder',journey:'/journey',failure:'/labs/failure',internet:'/internet/as-routing',physical:'/internet/physical',observed:'/internet/observed',measured:'/measured'};
          const viewports={desktop:[1440,1000],short:[1280,720],tablet:[1024,768],portrait:[760,978],mobile:[390,844]};
          const out='artifacts/ui-verify';mkdirSync(out,{recursive:true});const report={sha:process.env.GITHUB_SHA,browser:version.Browser,results:{}};
          for(const [vp,[width,height]] of Object.entries(viewports)){
            await c.call('Emulation.setDeviceMetricsOverride',{width,height,deviceScaleFactor:1,mobile:vp==='mobile'});
            await c.call('Emulation.setEmulatedMedia',{features:[{name:'prefers-reduced-motion',value:'reduce'}]});
            for(const [name,path] of Object.entries(routes)){
              await c.call('Page.navigate',{url:`http://127.0.0.1:4173${path}`});await sleep(650);
              const m=await c.eval(`(()=>{const vw=innerWidth;const visible=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0&&r.width>0&&r.height>0};const desc=e=>{const r=e.getBoundingClientRect();return{tag:e.tagName,cls:String(e.className||'').slice(0,80),text:String(e.innerText||e.getAttribute('aria-label')||'').trim().replace(/\\s+/g,' ').slice(0,90),left:Math.round(r.left),right:Math.round(r.right),top:Math.round(r.top),bottom:Math.round(r.bottom),w:Math.round(r.width),h:Math.round(r.height)}};const all=[...document.querySelectorAll('body *')];const overflow=all.filter(visible).filter(e=>!e.closest('.network-field')).map(desc).filter(x=>x.left<-2||x.right>vw+2).slice(0,80);const unnamed=[...document.querySelectorAll('button,a,[role=button]')].filter(visible).filter(e=>!(e.innerText||e.getAttribute('aria-label')||e.getAttribute('title'))).map(desc).slice(0,30);return{docW:document.documentElement.scrollWidth,docH:document.documentElement.scrollHeight,overflow,unnamed}})()`);
              const lm=await c.call('Page.getLayoutMetrics');const size=lm.cssContentSize||lm.contentSize;const capH=Math.max(height,Math.min(Math.ceil(size.height),12000));const shot=await c.call('Page.captureScreenshot',{format:'png',fromSurface:true,captureBeyondViewport:true,clip:{x:0,y:0,width:width,height:capH,scale:1}});writeFileSync(join(out,`${vp}-${name}.png`),Buffer.from(shot.data,'base64'));report.results[`${vp}:${name}`]={...m,contentH:size.height};
            }
          }
          writeFileSync(join(out,'report.json'),JSON.stringify(report,null,2));chrome.kill('SIGKILL');
          console.log('captured',Object.keys(report.results).length,'states');
          NODE
          node /tmp/ui-verify.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: hopscotch-ui-verify
          path: artifacts/ui-verify
          retention-days: 3
