name: Temp Lab 11N OSPFv3 Policy

on:
  push:
    branches: [agent/lab-11n-ospfv3-policy]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lab-11n-ospfv3-policy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/_tmp_write_ipv6_routing_depth.py
      - run: python3 scripts/_tmp_patch_ipv6_routing_depth.py
      - run: npm ci
      - run: npm run check
      - run: npm run performance:check
      - run: npm run compatibility:chrome
      - name: Commit validated advanced OSPFv3/policy implementation
        env:
          BRANCH: agent/lab-11n-ospfv3-policy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/BuilderIpv6RoutingDepthPanel.tsx src/BuilderIpv6Panel.tsx src/NetworkBuilder.tsx src/builder/ipv6-routing-depth.ts src/builder/ipv6-probes.ts src/builder/ipv6.ts scripts/builder-ipv6-routing-depth-contract-check.mjs package.json docs/ROADMAP.md docs/LAB11N.md
          git rm scripts/_tmp_write_ipv6_routing_depth.py scripts/_tmp_patch_ipv6_routing_depth.py .github/workflows/_tmp-lab11n-ospfv3-policy.yml
          git commit -m 'Lab 11N: add timed multi-area OSPFv3 and IPv6 policy [lab11n-ospfv3-policy-finalized]'
          git push origin HEAD:$BRANCH
