name: Apply Lab 10B deep links

on:
  push:
    branches: [agent/lab-10b-deep-links]
    paths:
      - scripts/apply-deep-link-navigation.py
      - .github/workflows/apply-deep-link-navigation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lab-10b-deep-links
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply bounded navigation integration
        run: python3 scripts/apply-deep-link-navigation.py
      - run: npm ci
      - run: npm run check
      - name: Remove one-shot integration scaffolding
        run: rm scripts/apply-deep-link-navigation.py .github/workflows/apply-deep-link-navigation.yml
      - name: Commit integrated deep links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/navigation.ts scripts/navigation-contract-check.mjs package.json docs/ROADMAP.md scripts/apply-deep-link-navigation.py .github/workflows/apply-deep-link-navigation.yml
          git commit -m "Integrate canonical lab deep links"
          git push origin HEAD:agent/lab-10b-deep-links
