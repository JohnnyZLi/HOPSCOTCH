name: Apply Lab 07C model codemod

on:
  push:
    branches:
      - agent/lab07-modifier-composition

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lab07-modifier-composition
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/apply-lab07c-model.mjs
      - name: Commit model changes
        run: |
          if git diff --quiet; then
            echo "No source changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/journey/model.ts src/journey/modifiers.ts package.json
          git commit -m "Add canonical Journey modifier sets"
          git push origin HEAD:agent/lab07-modifier-composition
