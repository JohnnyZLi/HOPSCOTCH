name: Lab 07D PR apply

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    if: github.event.pull_request.head.ref == 'agent/lab-07d-mid-transfer-path-outage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lab-07d-mid-transfer-path-outage
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Apply embedded Lab 07D patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/lab07d-agent-patch.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          script = textwrap.dedent(source[start:end])
          exec(compile(script, 'lab07d-embedded-patch.py', 'exec'))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run full contract, type, and build gate
        run: npm run check

      - name: Commit validated implementation
        shell: bash
        run: |
          rm .github/workflows/lab07d-agent-patch.yml .github/workflows/lab07d-pr-apply.yml
          git config user.name "HOPSCOTCH Agent"
          git config user.email "actions@users.noreply.github.com"
          git add package.json src scripts .github/workflows/lab07d-agent-patch.yml .github/workflows/lab07d-pr-apply.yml
          git commit -m "Lab 07D: recover across a mid-transfer path outage" -m "Adds a distinct path-outage modifier with routing convergence, TCP RTO recovery, QUIC PTO/probe recovery, GOD MODE UI support, portable scenario compatibility, and permanent contracts. Closes #42."
          git push origin HEAD:agent/lab-07d-mid-transfer-path-outage
