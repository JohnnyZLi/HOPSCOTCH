name: Track F integration patch
on:
  push:
    branches: [agent/track-f-routing-policy-depth]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/track-f-routing-policy-depth
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Normalize one-shot patch source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/track-f-patch.mjs')
          text=p.read_text()
          text='\n'.join(line for line in text.splitlines() if 's=s.replace("allowRelationshipLeak:entry.allowRelationshipLeak===true};"' not in line)+'\n'
          text=text.replace("holdTimeMs=Math.max(3000,Math.min(180000,Math.round(Number(entry.holdTimeMs)||90000));return", "holdTimeMs=Math.max(3000,Math.min(180000,Math.round(Number(entry.holdTimeMs)||90000)));return")
          p.write_text(text)
          PY
      - name: Apply integration patch
        run: node scripts/track-f-patch.mjs
      - name: Commit permanent Track F integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Track F: integrate routing policy depth"
          git push origin agent/track-f-routing-policy-depth
