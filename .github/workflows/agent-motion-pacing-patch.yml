name: Agent Journey Motion Pacing Patch

on:
  push:
    branches:
      - agent/journey-motion-shape-overhaul

permissions:
  contents: write

jobs:
  patch-pacing:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/journey-motion-shape-overhaul
          fetch-depth: 0
      - name: Normalize presentation pacing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/VisualWorkspace.tsx')
          source = path.read_text()

          replacements = {
              'const PRESENTATION_READABILITY_SCALE = 2;': 'const PRESENTATION_READABILITY_SCALE = 1;',
              '  neutral: 1400 * PRESENTATION_READABILITY_SCALE,': '  neutral: 820 * PRESENTATION_READABILITY_SCALE,',
              '  evidence: 1600 * PRESENTATION_READABILITY_SCALE,': '  evidence: 880 * PRESENTATION_READABILITY_SCALE,',
              '  success: 1700 * PRESENTATION_READABILITY_SCALE,': '  success: 900 * PRESENTATION_READABILITY_SCALE,',
              '  warning: 2100 * PRESENTATION_READABILITY_SCALE,': '  warning: 980 * PRESENTATION_READABILITY_SCALE,',
              '  danger: 2800 * PRESENTATION_READABILITY_SCALE,': '  danger: 1100 * PRESENTATION_READABILITY_SCALE,',
              'const PRESENTATION_BASE_SLOWDOWN = 1.35 * PRESENTATION_READABILITY_SCALE;': 'const PRESENTATION_BASE_SLOWDOWN = 1 * PRESENTATION_READABILITY_SCALE;',
          }

          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f'Expected exactly one pacing token: {old!r}')
              source = source.replace(old, new)

          source = source.replace(
              '// 1× is the human-readable presentation baseline. Scaling every presentation\n// segment by two makes the new 1× exactly match the previous 0.5× pace while\n// leaving canonical model time, displayed timestamps, and exact scrubbing intact.\n',
              '// 1× is paced for visual comprehension: each semantic beat has enough wall-clock\n// time for the renderer to move and briefly settle, without stretching warning or\n// danger states into multi-second pauses. Canonical model time and scrubbing stay exact.\n',
          )
          path.write_text(source)
          PY
          rm .github/workflows/agent-motion-pacing-patch.yml
      - name: Commit pacing patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/VisualWorkspace.tsx .github/workflows/agent-motion-pacing-patch.yml
          git commit -m "Normalize Journey presentation pacing"
          git push origin HEAD:agent/journey-motion-shape-overhaul
