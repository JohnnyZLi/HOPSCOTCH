name: Track D one-shot roadmap closeout

on:
  push:
    branches:
      - agent/track-d-closeout
    paths:
      - .github/workflows/track-d-roadmap-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/track-d-closeout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply Track D roadmap closeout
        run: node scripts/track-d-roadmap-closeout.mjs
      - name: Remove one-shot closeout machinery
        run: git rm .github/workflows/track-d-roadmap-closeout.yml scripts/track-d-roadmap-closeout.mjs
      - name: Commit roadmap closeout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ROADMAP.md
          git commit -m "Track D: close roadmap and promote Track A"
          git push origin HEAD:agent/track-d-closeout
