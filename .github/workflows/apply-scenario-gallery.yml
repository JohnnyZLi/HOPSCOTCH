name: Apply Lab 10D scenario gallery

on:
  push:
    branches: [agent/lab-10d-scenario-gallery]
    paths:
      - scripts/apply-scenario-gallery.py
      - .github/workflows/apply-scenario-gallery.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lab-10d-scenario-gallery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply scenario gallery integration
        run: python3 scripts/apply-scenario-gallery.py
      - run: npm ci
      - run: npm run check
      - run: npm run performance:check
      - name: Remove one-shot integration scaffolding
        run: rm scripts/apply-scenario-gallery.py .github/workflows/apply-scenario-gallery.yml
      - name: Commit integrated gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/ExploreLauncher.tsx src/ScenarioGallery.tsx src/ScenarioGallery.css src/scenarios/catalog.ts src/journey/presets.ts scripts/scenario-gallery-contract-check.mjs package.json docs/ROADMAP.md scripts/apply-scenario-gallery.py .github/workflows/apply-scenario-gallery.yml
          git commit -m "Integrate one-click Journey scenario gallery"
          git push origin HEAD:agent/lab-10d-scenario-gallery
