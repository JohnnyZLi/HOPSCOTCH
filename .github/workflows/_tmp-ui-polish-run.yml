name: Temp UI Polish Run
on:
  push:
    branches: [fix/ui-audit-responsive]
    paths: [.github/workflows/_tmp-ui-polish-run.yml]
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/ui-audit-responsive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/_tmp-ui-polish.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check
      - run: npm run build
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Polish short-height and mobile layouts"
          git push origin HEAD:fix/ui-audit-responsive
