name: Track A lazy history-bound move

on:
  push:
    branches:
      - agent/track-a-closeout
    paths:
      - .github/workflows/track-a-move-history-bound.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/track-a-closeout
          fetch-depth: 0
      - name: Keep application-history bounding in lazy workspace
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/NetworkBuilder.tsx')
          s=p.read_text()
          old="onTransaction={(transaction)=>setApplicationHistory((current)=>[...current,transaction].slice(-24))}"
          new="onTransaction={setApplicationHistory}"
          if old not in s:
              raise SystemExit('application transaction callback marker missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          git config user.name "Johnny"
          git config user.email "92900710+JohnnyZLi@users.noreply.github.com"
          git add src/NetworkBuilder.tsx
          git commit -m "Track A: keep history bounding in lazy workspace"
          git push origin HEAD:agent/track-a-closeout
