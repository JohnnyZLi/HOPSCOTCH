name: Track A lazy workbench boundary

on:
  push:
    branches:
      - agent/track-a-closeout
    paths:
      - .github/workflows/track-a-lazy-workbench-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/track-a-closeout
          fetch-depth: 0
      - name: Split workbench depth from startup bundle
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('src/builder/device-workbench.ts')
          s=p.read_text()
          imp="import { builderApplicationDiagnosisSection, builderProtocolDatabaseSection } from './workbench-depth.ts';\n"
          if imp not in s: raise SystemExit('workbench-depth import marker missing')
          s=s.replace(imp,'',1)
          old="""  const baseStateSections=device.plane==='routed'?routedStateSections(input,device.id):ethernetStateSections(input,device.id);
            const depthSections=[builderProtocolDatabaseSection(input,device),builderApplicationDiagnosisSection(input,device)].filter((entry):entry is BuilderWorkbenchSection=>Boolean(entry));
            const stateSections=[...baseStateSections,...depthSections];
            return{device,configSections,stateSections,events:eventViews(input.events,device),configRowCount:configSections.reduce((sum,current)=>sum+current.rows.length,0),stateRowCount:stateSections.reduce((sum,current)=>sum+current.rows.length,0)};"""
          new="""  const stateSections=device.plane==='routed'?routedStateSections(input,device.id):ethernetStateSections(input,device.id);
            return{device,configSections,stateSections,events:eventViews(input.events,device),configRowCount:configSections.reduce((sum,current)=>sum+current.rows.length,0),stateRowCount:stateSections.reduce((sum,current)=>sum+current.rows.length,0)};"""
          if old not in s: raise SystemExit('workbench state-section marker missing')
          p.write_text(s.replace(old,new,1))

          p=Path('src/NetworkBuilder.tsx')
          s=p.read_text()
          old="""<BuilderDeviceWorkbench snapshot={workbenchSnapshot} options={workbenchOptions} historicalSequence={historicalTimelineSnapshot?.sequence??null} diff={workbenchTimelineDiff} onSelect={(ref)=>{setWorkbenchDevice(ref);if(ref.plane==='routed')setSelectedNodeId(ref.id);}}/>"""
          new="""<BuilderDeviceWorkbench snapshot={workbenchSnapshot} options={workbenchOptions} historicalSequence={historicalTimelineSnapshot?.sequence??null} diff={workbenchTimelineDiff} depthInput={displayedWorkbenchInput} onSelect={(ref)=>{setWorkbenchDevice(ref);if(ref.plane==='routed')setSelectedNodeId(ref.id);}}/>"""
          if old not in s: raise SystemExit('NetworkBuilder workbench marker missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit split
        run: |
          git config user.name "Johnny"
          git config user.email "92900710+JohnnyZLi@users.noreply.github.com"
          git add src/builder/device-workbench.ts src/NetworkBuilder.tsx
          git commit -m "Track A: split causal depth from startup bundle"
          git push origin HEAD:agent/track-a-closeout
