name: Agent Journey Projection Timing Patch

on:
  push:
    branches:
      - agent/journey-motion-shape-overhaul

permissions:
  contents: write

jobs:
  patch-projection-timing:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/journey-motion-shape-overhaul
          fetch-depth: 0
      - name: Split spatial and opacity timing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/JourneyMotionShape.css')
          source = path.read_text()
          old = '''.phase5b-physical .phase5c-mac-token,
.phase5b-physical .phase5c-ip-token,
.phase5b-physical .phase5b-mac-projection,
.phase5b-physical .phase5b-route-projection {
  transition-duration: var(--journey-motion-spatial) !important;
  transition-timing-function: var(--journey-ease-move) !important;
}
'''
          new = '''.phase5b-physical .phase5c-mac-token,
.phase5b-physical .phase5c-ip-token {
  transition: transform var(--journey-motion-spatial) var(--journey-ease-move), opacity var(--journey-motion-micro) ease !important;
}
.phase5b-physical .phase5b-mac-projection,
.phase5b-physical .phase5b-route-projection {
  transition: transform var(--journey-motion-spatial) var(--journey-ease-move), opacity var(--journey-motion-micro) ease !important;
}
'''
          if source.count(old) != 1:
              raise SystemExit('projection timing block not found exactly once')
          path.write_text(source.replace(old, new))
          PY
          rm .github/workflows/agent-motion-projection-patch.yml
      - name: Commit projection timing patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/JourneyMotionShape.css .github/workflows/agent-motion-projection-patch.yml
          git commit -m "Separate projection visibility from spatial travel"
          git push origin HEAD:agent/journey-motion-shape-overhaul
