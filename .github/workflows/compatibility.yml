name: Compatibility

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  chrome-gpu-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        gpu: [default, swiftshader, disabled]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run production compatibility profile
        env:
          HOPSCOTCH_GPU_MODE: ${{ matrix.gpu }}
          HOPSCOTCH_REPORT_PATH: artifacts/compatibility-${{ matrix.gpu }}.json
        run: npm run compatibility:chrome
      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hopscotch-compatibility-${{ matrix.gpu }}
          path: artifacts/compatibility-${{ matrix.gpu }}.json
          if-no-files-found: error
          retention-days: 3

  firefox-semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run Firefox production semantic compatibility
        run: npm run compatibility:firefox
      - name: Upload Firefox reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hopscotch-firefox-compatibility
          path: artifacts/firefox-compatibility.json
          if-no-files-found: error
          retention-days: 3

  capture-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Exercise local PCAP and PCAPNG replay in the production artifact
        run: npm run compatibility:capture
      - name: Upload captured-replay browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hopscotch-capture-browser
          path: artifacts/capture-browser.json
          if-no-files-found: error
          retention-days: 3

  phase3-visual-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Capture Phase 3 production viewport matrix
        run: npm run visual:phase3
      - name: Upload Phase 3 visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hopscotch-phase3-visual-review
          path: artifacts/phase3-visual-review
          if-no-files-found: error
          retention-days: 7

  phase4-visual-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Capture Phase 4 evidence viewport matrix
        run: npm run visual:phase4
      - name: Upload Phase 4 visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hopscotch-phase4-visual-review
          path: artifacts/phase4-visual-review
          if-no-files-found: error
          retention-days: 7

  timeline-visual-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Measure presentation pacing and capture timeline workspaces
        run: node scripts/timeline-visual-review.mjs
      - name: Upload timeline visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hopscotch-timeline-visual-review
          path: artifacts/timeline-visual-review
          if-no-files-found: error
          retention-days: 7

  journey-annotation-visual-review:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Audit every Journey annotation state
        run: node scripts/journey-annotation-visual-review.mjs
      - name: Prove Phase 5 choreography moves between deterministic states
        run: node scripts/phase5-choreography-review.mjs
      - name: Verify Journey DNS connector geometry
        run: node scripts/journey-dns-geometry-review.mjs
      - name: Upload Journey annotation audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hopscotch-journey-annotation-visual-review
          path: artifacts/journey-annotation-visual-review
          if-no-files-found: error
          retention-days: 7
      - name: Upload Phase 5 choreography evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hopscotch-phase5-choreography-review
          path: artifacts/phase5-choreography-review
          if-no-files-found: error
          retention-days: 7
      - name: Upload Journey DNS geometry review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hopscotch-journey-dns-geometry-review
          path: artifacts/journey-dns-geometry-review
          if-no-files-found: error
          retention-days: 7

  scale-inspector-visual-review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Measure and capture overview scale detail card
        run: node scripts/scale-inspector-visual-review.mjs
      - name: Verify desktop overview layout stability
        run: node scripts/overview-layout-stability-review.mjs
      - name: Upload scale inspector visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hopscotch-scale-inspector-visual-review
          path: artifacts/scale-inspector-visual-review
          if-no-files-found: error
          retention-days: 7
      - name: Upload overview layout stability review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hopscotch-overview-layout-stability-review
          path: artifacts/overview-layout-stability-review
          if-no-files-found: error
          retention-days: 7
