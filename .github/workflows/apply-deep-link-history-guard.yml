name: Apply Lab 10B history guard

on:
  push:
    branches: [agent/lab-10b-deep-links]
    paths:
      - scripts/apply-deep-link-history-guard.py
      - .github/workflows/apply-deep-link-history-guard.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lab-10b-deep-links
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply browser-history guard
        run: python3 scripts/apply-deep-link-history-guard.py
      - run: npm ci
      - run: npm run check
      - run: npm run performance:check
      - name: Remove one-shot guard scaffolding
        run: rm scripts/apply-deep-link-history-guard.py .github/workflows/apply-deep-link-history-guard.yml
      - name: Commit browser-history guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx scripts/navigation-contract-check.mjs scripts/apply-deep-link-history-guard.py .github/workflows/apply-deep-link-history-guard.yml
          git commit -m "Guard deep-link history outside HTTP contexts"
          git push origin HEAD:agent/lab-10b-deep-links
