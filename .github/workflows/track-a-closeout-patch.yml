name: Track A one-shot closeout patch

on:
  push:
    branches:
      - agent/track-a-closeout
    paths:
      - .github/workflows/track-a-closeout-patch.yml
      - scripts/track-a-closeout-patch.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/track-a-closeout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply Track A closeout patch
        run: node scripts/track-a-closeout-patch.mjs
      - name: Commit generated integration
        run: |
          git config user.name "Johnny"
          git config user.email "92900710+JohnnyZLi@users.noreply.github.com"
          git add src package.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Track A: integrate causal timeline closeout"
          git push origin HEAD:agent/track-a-closeout
