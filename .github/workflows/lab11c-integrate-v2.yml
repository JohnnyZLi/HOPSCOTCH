name: Lab 11C corrected integration

on:
  push:
    branches:
      - agent/lab-11c-builder-ospf

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, 'Integrate Lab 11C OSPF') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lab-11c-builder-ospf
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply and validate Lab 11C
        run: |
          PAYLOAD="$(git show 435a95a87d25958482d8e5eef60e4a63d93b18c1:.github/workflows/lab11c-integrate.yml | sed -n 's/^          PAYLOAD: //p')"
          printf '%s' "$PAYLOAD" | base64 -d | gzip -d > /tmp/integrate-lab11c.mjs
          python3 - <<'PY'
          from pathlib import Path
          helper = Path('/tmp/integrate-lab11c.mjs')
          text = helper.read_text()
          needle = "className={\\`${entry.active?'':'inactive'} source-\\${entry.source}\\`}"
          replacement = "className={\\`\\${entry.active?'':'inactive'} source-\\${entry.source}\\`}"
          if text.count(needle) != 1:
              raise SystemExit(f'expected helper escape bug once, found {text.count(needle)}')
          helper.write_text(text.replace(needle, replacement))
          PY
          node /tmp/integrate-lab11c.mjs
          python3 - <<'PY'
          from pathlib import Path
          scenario = Path('src/builder/scenario.ts')
          text = scenario.read_text().replace('BuilderScenarioV4', 'BuilderScenarioV5')
          text = text.replace("export interface BuilderScenarioV5 {\n  schema: 'hopscotch.builder';\n  version: 4;", "export interface BuilderScenarioV4 {\n  schema: 'hopscotch.builder';\n  version: 4;")
          text = text.replace("export type BuilderScenarioV5 = Omit<BuilderScenarioV5, 'version'> & { version: 5 };", "export type BuilderScenarioV5 = Omit<BuilderScenarioV4, 'version'> & { version: 5 };")
          scenario.write_text(text)
          PY
          npm ci
          npm run check
      - name: Commit permanent Lab 11C tree
        run: |
          rm .github/workflows/lab11c-integrate-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate Lab 11C OSPF control plane"
          git push origin HEAD:agent/lab-11c-builder-ospf
