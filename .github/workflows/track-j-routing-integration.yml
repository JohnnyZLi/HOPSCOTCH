name: Track J routing integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/track-j-routing-ospf-challenges'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/track-j-routing-ospf-challenges
          fetch-depth: 2
      - name: Apply stored bounded patch
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          raw = subprocess.check_output([
              'git', 'show', 'HEAD^:.github/workflows/track-j-routing-integration.yml'
          ], text=True)
          start = raw.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = raw.index("\n          PY\n", start)
          block = raw[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          Path('/tmp/track-j-routing-patch.py').write_text(script)
          subprocess.run(['python', '/tmp/track-j-routing-patch.py'], check=True)
          PY
      - name: Commit routed challenge slice
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/builder/challenges.ts src/NetworkBuilder.tsx scripts/builder-challenge-contract-check.mjs docs/TRACKJ.md
          git commit -m "Add routing and OSPF troubleshooting challenges"
          git push origin HEAD:agent/track-j-routing-ospf-challenges
