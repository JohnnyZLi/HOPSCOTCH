name: Temp UI Polish

on:
  push:
    branches:
      - fix/ui-audit-responsive
    paths:
      - .github/workflows/_tmp-ui-polish.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/ui-audit-responsive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply final visual polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'{path}: expected text not found: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # Short desktop/laptop viewports need a denser overview so the action deck
          # remains above the fixed timeline instead of being visually occluded.
          replace(
              'src/styles.css',
              '''@media (min-width: 1181px) and (max-height: 820px) {
  .scale-rail {
    top: 110px;
    transform: none;
  }

  .layer-card {
    bottom: 88px;
  }
}''',
              '''@media (min-width: 1181px) and (max-height: 820px) {
  .hero-copy {
    margin-top: 44px;
  }

  .hero-copy h1 {
    margin: 10px 0 16px;
    font-size: clamp(3.25rem, 5.8vw, 5.9rem);
  }

  .lede {
    max-width: 590px;
    font-size: 0.96rem;
    line-height: 1.48;
  }

  .scale-rail {
    top: 110px;
    transform: none;
  }

  .layer-card {
    bottom: 88px;
  }
}'''
          )

          p = Path('src/HomeActionDeck.css')
          text = p.read_text()
          marker = '@media (max-width: 980px) {'
          if marker not in text:
              raise SystemExit('HomeActionDeck.css: responsive marker not found')
          compact = '''@media (min-width: 1181px) and (max-height: 820px) {
  .home-action-deck {
    margin-top: 18px;
  }

  .home-action-card {
    min-height: 154px;
    padding: 12px 14px;
  }

  .home-action-card p {
    margin: 7px 0 9px;
    font-size: 0.66rem;
    line-height: 1.38;
  }

  .home-action-footer {
    padding-top: 8px;
  }

  .home-action-card small {
    margin-top: 5px;
  }
}

'''
          p.write_text(text.replace(marker, compact + marker, 1))

          # The HTTP page was styled in pass one, but its mobile status strip still
          # inherited a desktop horizontal row. Wrap it into a bounded two-column grid.
          replace(
              'src/http-comparison.css',
              '.http-stage-meta{gap:14px;overflow-x:auto}.http-stage-meta>div{min-width:max-content}',
              '.http-stage-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 14px;overflow:visible}.http-stage-meta>div{min-width:0}.http-stage-meta>div:first-child{grid-column:1/-1}'
          )
          PY
      - name: Validate source tree
        run: |
          npm ci
          npm run typecheck
          npm run check
          npm run build
      - name: Commit final visual polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Polish short-height and mobile layouts"
          git push origin HEAD:fix/ui-audit-responsive
