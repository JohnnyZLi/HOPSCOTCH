name: Reapply Lab 11B Builder static routing final

on:
  push:
    branches: [agent/lab-11b-builder-static-routing]
    paths:
      - .github/workflows/apply-builder-static-routing-rerun2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lab-11b-builder-static-routing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Restore stable graph label
        run: python3 scripts/fix-builder-static-meta.py
      - name: Apply Builder static routing integration
        run: python3 scripts/apply-builder-static-routing.py
      - name: Update Builder browser semantics
        run: python3 scripts/fix-builder-routing-harness.py
      - run: npm ci
      - run: npm run check
      - run: npm run performance:check
      - name: Remove one-shot integration scaffolding
        run: rm scripts/apply-builder-static-routing.py scripts/fix-builder-static-meta.py scripts/fix-builder-routing-harness.py .github/workflows/apply-builder-static-routing.yml .github/workflows/apply-builder-static-routing-rerun.yml .github/workflows/apply-builder-static-routing-rerun2.yml
      - name: Commit integrated Builder static routing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/NetworkBuilder.tsx src/NetworkBuilder.css src/builder/routing.ts src/builder/scenario.ts scripts/builder-routing-contract-check.mjs scripts/builder-addressing-contract-check.mjs scripts/high-density-contract-check.mjs scripts/performance-profile.mjs scripts/firefox-compatibility.mjs package.json docs/ROADMAP.md scripts/apply-builder-static-routing.py scripts/fix-builder-static-meta.py scripts/fix-builder-routing-harness.py .github/workflows/apply-builder-static-routing.yml .github/workflows/apply-builder-static-routing-rerun.yml .github/workflows/apply-builder-static-routing-rerun2.yml
          git commit -m "Integrate Builder static routing and forwarding"
          git push origin HEAD:agent/lab-11b-builder-static-routing
