name: Labs 11G-J production browser audit

on:
  push:
    branches:
      - agent/lab-11g-j-arp-stp-links-acl

permissions:
  contents: write

jobs:
  audit:
    if: ${{ github.event.head_commit.message != 'Add permanent Labs 11G-J browser contract' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lab-11g-j-arp-stp-links-acl
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply and exercise production browser contract
        run: |
          python3 scripts/lab11gj-browser.py
          python3 scripts/lab11gj-browser-postfix.py
          npm ci
          npm run check
          mkdir -p artifacts
          HOPSCOTCH_REPORT_PATH=artifacts/lab11gj-browser-audit.json npm run compatibility:chrome
          HOPSCOTCH_REPORT_PATH=artifacts/lab11gj-performance.json npm run performance:check
      - name: Commit permanent browser contract
        run: |
          rm .github/workflows/lab11gj-browser.yml scripts/lab11gj-browser.py scripts/lab11gj-browser-postfix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add permanent Labs 11G-J browser contract"
          git push origin HEAD:agent/lab-11g-j-arp-stp-links-acl
      - name: Upload exact-artifact audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab11gj-builder-audit
          path: |
            artifacts/lab11gj-browser-audit.json
            artifacts/lab11gj-performance.json
            artifacts/builder-depth-*.png
            artifacts/builder-ospf-*.png
          if-no-files-found: warn
          retention-days: 3
