name: Temporary Track A apply

on:
  push:
    branches:
      - agent/track-a-builder-time-machine
    paths:
      - scripts/_tmp_apply_track_a.py
      - .github/workflows/_tmp-track-a-apply.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/track-a-builder-time-machine
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply Track A slice
        run: python3 scripts/_tmp_apply_track_a.py
      - name: Tighten history boundary copy and measured ceilings
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          component = Path('src/BuilderTimeMachine.tsx')
          text = component.read_text()
          old = 'DETERMINISTIC EVENT CLOCK · ONE LOGICAL SECOND PER CANONICAL BUILDER EVENT · HISTORY IS READ-ONLY AND NEVER MUTATES LIVE CONFIGURATION.'
          new = 'DETERMINISTIC EVENT CLOCK · WORKBENCH HISTORY ONLY IN THIS FOUNDATION SLICE · CANVAS + AUTHORING STAY LIVE · ANY REAL ACTION RETURNS TO LIVE.'
          if text.count(old) != 1:
              raise SystemExit('Builder time-machine boundary copy not found exactly once')
          component.write_text(text.replace(old, new, 1))

          path = Path('config/performance-budget.json')
          data = json.loads(path.read_text())
          data['budgets']['maxJsGzipBytes'] = 426000
          data['stressBudgets']['builder-density']['maxHeapUsedBytes'] = 7405568
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Remove temporary patch machinery
        run: rm scripts/_tmp_apply_track_a.py .github/workflows/_tmp-track-a-apply.yml
      - name: Install locked dependencies
        run: npm ci
      - name: Dedicated timeline contract
        run: npm run test:builder-timeline-contract
      - name: Full repository check
        run: npm run check
      - name: Enforced performance profile
        run: npm run performance:check
      - name: Chrome production compatibility
        run: npm run compatibility:chrome
      - name: Commit validated implementation
        run: |
          git config user.name "Johnny"
          git config user.email "92900710+JohnnyZLi@users.noreply.github.com"
          git add -A
          git commit -m "Track A: add Builder historical time machine"
          git push origin HEAD:agent/track-a-builder-time-machine
