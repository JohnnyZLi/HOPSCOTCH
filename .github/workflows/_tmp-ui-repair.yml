name: Temp UI Repair

on:
  push:
    branches:
      - fix/ui-audit-responsive
    paths:
      - .github/workflows/_tmp-ui-repair.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/ui-audit-responsive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply audited UI fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f'{path}: expected at least {count} occurrence(s), found {actual}: {old[:120]!r}')
              text = text.replace(old, new, count)
              p.write_text(text)

          # HTTP comparison stylesheet was shipped but never imported.
          replace('src/main.tsx', "import './tls.css';\n", "import './tls.css';\nimport './http-comparison.css';\n")

          # Overview side rail/card: switch earlier to the compact composition and account for short wide viewports.
          replace('src/styles.css', '@media (max-width: 980px) {\n  .scale-rail {\n    top: auto;\n    right: 32px;\n    bottom: 110px;', '@media (max-width: 1180px) {\n  .scale-rail {\n    top: 104px;\n    right: 32px;\n    bottom: auto;')
          replace('src/styles.css', '@media (max-width: 760px) {\n  .scale-rail {', '@media (min-width: 1181px) and (max-height: 820px) {\n  .scale-rail {\n    top: 110px;\n    transform: none;\n  }\n\n  .layer-card {\n    bottom: 88px;\n  }\n}\n\n@media (max-width: 760px) {\n  .scale-rail {')
          replace('src/styles.css', '  .scale-rail {\n    right: 18px;\n    left: 18px;\n    overflow-x: auto;\n    justify-content: start;\n  }\n\n  .scale-rail button {\n    flex: 0 0 auto;\n  }', '  .scale-rail {\n    right: 18px;\n    left: 18px;\n    overflow-x: auto;\n    justify-content: start;\n    scroll-snap-type: x proximity;\n    -webkit-mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 26px), transparent 100%);\n    mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 26px), transparent 100%);\n  }\n\n  .scale-rail button {\n    flex: 0 0 auto;\n    scroll-snap-align: start;\n  }\n\n  .brand-button,\n  .explore-trigger {\n    min-height: 40px;\n  }\n\n  .brand-button {\n    padding: 8px 0;\n  }')

          # Stale lab number in the overview footer.
          replace('src/App.tsx', 'Lab 06 Journey · Lab 09 measured', 'Lab 07 Journey · Lab 09 measured')

          # Packet layer strip must fit on phones instead of hiding the payload layer offscreen.
          replace('src/packet.css', '  .packet-object {\n    gap: 4px;\n    min-height: 104px;\n    overflow-x: auto;\n    padding: 12px 0 5px;\n    scrollbar-width: none;\n  }', '  .packet-object {\n    display: grid;\n    grid-template-columns: repeat(4, minmax(0, 1fr));\n    gap: 4px;\n    min-height: 104px;\n    overflow: visible;\n    padding: 12px 0 5px;\n  }')
          replace('src/packet.css', '  .packet-layer-shell {\n    min-width: 98px;\n    flex: 0 0 98px !important;\n  }', '  .packet-layer-shell {\n    min-width: 0;\n    width: 100%;\n    flex: none !important;\n    padding: 14px 9px 12px;\n  }\n\n  .packet-layer-shell strong {\n    font-size: 0.75rem;\n  }\n\n  .packet-ttl-control {\n    grid-template-columns: auto 34px 30px 34px;\n  }\n\n  .packet-ttl-control button {\n    width: 34px;\n    height: 34px;\n  }')

          # Keep animated TCP messages inside the actual wire-stage bounds at every responsive width.
          replace('src/TcpTheater.tsx', "    if (!root || reduceMotion) return;\n    const animations: Array<ReturnType<typeof animate>> = [];\n    const token = root.querySelector<HTMLElement>('.tcp-message-token');\n    const windowCells = root.querySelectorAll('.tcp-window-cell.is-active');\n\n    if (activeEvent.direction !== 'local' && token) {\n      const leftToRight = activeEvent.direction === 'client-to-server';\n      const start = leftToRight ? '11%' : '89%';\n      const end = leftToRight ? '89%' : '11%';", "    if (!root) return;\n    const animations: Array<ReturnType<typeof animate>> = [];\n    const token = root.querySelector<HTMLElement>('.tcp-message-token');\n    const wireStage = root.querySelector<HTMLElement>('.tcp-wire-stage');\n    const windowCells = root.querySelectorAll('.tcp-window-cell.is-active');\n\n    if (reduceMotion) {\n      if (token) {\n        token.style.left = '50%';\n        token.style.opacity = activeEvent.direction === 'local' ? '0' : '1';\n      }\n      return;\n    }\n\n    if (activeEvent.direction !== 'local' && token && wireStage) {\n      const leftToRight = activeEvent.direction === 'client-to-server';\n      const safeInset = Math.min(34, Math.max(11, ((token.offsetWidth / 2 + 10) / Math.max(wireStage.clientWidth, 1)) * 100));\n      const start = leftToRight ? `${safeInset}%` : `${100 - safeInset}%`;\n      const end = leftToRight ? `${100 - safeInset}%` : `${safeInset}%`;")

          # DNS message choreography: reduced-motion users should not get an unpositioned token, and normal motion is clamped to the stage.
          replace('src/DnsTheater.tsx', "    if (!root || reduceMotion) return;\n    const token = root.querySelector<HTMLElement>('.dns-message-token');", "    if (!root) return;\n    const token = root.querySelector<HTMLElement>('.dns-message-token');")
          replace('src/DnsTheater.tsx', "    const startX = fromRect.left + fromRect.width / 2 - stageRect.left;\n    const startY = fromRect.top + fromRect.height / 2 - stageRect.top;\n    const endX = toRect.left + toRect.width / 2 - stageRect.left;\n    const endY = toRect.top + toRect.height / 2 - stageRect.top;\n\n    token.style.left = `${startX}px`;\n    token.style.top = `${startY}px`;\n    token.style.opacity = '0';", "    const rawStartX = fromRect.left + fromRect.width / 2 - stageRect.left;\n    const rawStartY = fromRect.top + fromRect.height / 2 - stageRect.top;\n    const rawEndX = toRect.left + toRect.width / 2 - stageRect.left;\n    const rawEndY = toRect.top + toRect.height / 2 - stageRect.top;\n    const halfWidth = Math.min(stageRect.width / 2 - 4, token.offsetWidth / 2 + 8);\n    const halfHeight = Math.min(stageRect.height / 2 - 4, token.offsetHeight / 2 + 8);\n    const clampX = (value: number) => Math.max(halfWidth, Math.min(stageRect.width - halfWidth, value));\n    const clampY = (value: number) => Math.max(halfHeight, Math.min(stageRect.height - halfHeight, value));\n    const startX = clampX(rawStartX);\n    const startY = clampY(rawStartY);\n    const endX = clampX(rawEndX);\n    const endY = clampY(rawEndY);\n\n    if (reduceMotion) {\n      token.style.left = `${endX}px`;\n      token.style.top = `${endY}px`;\n      token.style.opacity = '0';\n      return;\n    }\n\n    token.style.left = `${startX}px`;\n    token.style.top = `${startY}px`;\n    token.style.opacity = '0';")

          # Mobile stage metadata should wrap instead of disappearing offscreen.
          replace('src/tcp.css', '  .tcp-stage-meta { gap:14px; overflow-x:auto; }\n  .tcp-stage-meta > div { min-width:max-content; }', '  .tcp-stage-meta { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; overflow:visible; }\n  .tcp-stage-meta > div { min-width:0; }')
          replace('src/dns.css', '  .dns-stage-meta { gap:14px; overflow-x:auto; }\n  .dns-stage-meta > div { min-width:max-content; }', '  .dns-stage-meta { display:grid; grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr); gap:9px 14px; overflow:visible; }\n  .dns-stage-meta > div { min-width:0; }\n  .dns-stage-meta > div:nth-child(3) { grid-column:1 / -1; }')
          replace('src/tls.css', '.tls-stage-meta{gap:14px;overflow-x:auto}.tls-stage-meta>div{min-width:max-content}', '.tls-stage-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 14px;overflow:visible}.tls-stage-meta>div{min-width:0}.tls-stage-meta>div:nth-child(3){grid-column:1/-1}')

          # Make the persistent mobile controls easier to hit without visually bloating desktop UI.
          replace('src/lab.css', '  .lab-stage {\n    min-height: 410px;\n  }', '  .lab-stage {\n    min-height: 410px;\n  }\n\n  .lab-mode {\n    min-height: 38px;\n    padding: 10px 12px;\n  }\n\n  .time-controls button {\n    width: 38px;\n    height: 38px;\n  }')
          replace('src/HomeActionDeck.css', '  .home-action-utilities {\n    gap: 2px 14px;\n  }', '  .home-action-utilities {\n    gap: 2px 14px;\n  }\n\n  .home-action-utilities button,\n  .home-action-utilities a {\n    min-height: 36px;\n    display: inline-flex;\n    align-items: center;\n  }')

          # Accessible names for the HTTP scrubber and selectable routed links.
          replace('src/HttpComparisonTheater.tsx', '<input type="range" min="0" max={HTTP_COMPARISON_DURATION_MS}', '<input aria-label="HTTP comparison timeline" type="range" min="0" max={HTTP_COMPARISON_DURATION_MS}')
          replace('src/NetworkBuilder.tsx', 'className={`builder-link ${link.failed ? \'failed\' : active ? \'active\' : \'alternate\'} ${forwarding ? \'l3-forwarding\' : \'\'} ${probeLinks.has(link.id) ? \'probe-active\' : \'\'} ${selectedLinkId === link.id ? \'selected\' : \'\'}`} role="button" tabIndex={0}', 'className={`builder-link ${link.failed ? \'failed\' : active ? \'active\' : \'alternate\'} ${forwarding ? \'l3-forwarding\' : \'\'} ${probeLinks.has(link.id) ? \'probe-active\' : \'\'} ${selectedLinkId === link.id ? \'selected\' : \'\'}`} role="button" aria-label={`${labelFor(graph, link.a)} to ${labelFor(graph, link.b)} link · ${link.failed ? \'down\' : `cost ${link.cost}`}`} tabIndex={0}')

          PY
      - name: Validate
        run: |
          npm ci
          npm run typecheck
          npm run check
          npm run build
      - name: Commit repaired UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Fix responsive UI audit findings"
          git push origin HEAD:fix/ui-audit-responsive
