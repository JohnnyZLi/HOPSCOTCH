name: Lab 11C bounded integration

on:
  push:
    branches:
      - agent/lab-11c-builder-ospf

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, 'Integrate Lab 11C OSPF') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lab-11c-builder-ospf
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply Lab 11C
        env:
          PAYLOAD: 
        run: |
          printf '%s' "$PAYLOAD" | base64 -d | gzip -d > /tmp/integrate-lab11c.mjs
          node /tmp/integrate-lab11c.mjs
          npm ci
          npm run check
      - name: Commit permanent Lab 11C tree
        run: |
          rm .github/workflows/lab11c-integrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate Lab 11C OSPF control plane"
          git push origin HEAD:agent/lab-11c-builder-ospf
