name: Temp Lab 11M Multi-Area Apply

on:
  push:
    branches: [agent/lab-11m-multiarea]

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[lab11m-multiarea-applied]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lab-11m-multiarea
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/_tmp_apply_lab11m_multiarea.py
      - run: npm ci
      - run: npm run check
      - name: Commit applied implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts package.json docs
          git commit -m "Lab 11M: add multi-area OSPF and ABR summaries [lab11m-multiarea-applied]"
          git push origin HEAD:agent/lab-11m-multiarea
