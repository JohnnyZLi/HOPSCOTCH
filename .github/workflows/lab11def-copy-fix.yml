name: Labs 11D-F Builder copy fix

on:
  push:
    branches:
      - agent/lab-11def-builder-probes-switching-vlans

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event.head_commit.message != 'Fix Builder schema v6 label' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lab-11def-builder-probes-switching-vlans
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Fix stale scenario label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('src/NetworkBuilder.tsx')
          text=path.read_text()
          old='SCHEMA V5 · STATIC + OSPF'
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale schema label, found {text.count(old)}')
          path.write_text(text.replace(old,'SCHEMA V6 · ROUTED + LAN'))
          PY
          npm ci
          npm run check
      - name: Commit copy fix
        run: |
          rm .github/workflows/lab11def-copy-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Builder schema v6 label"
          git push origin HEAD:agent/lab-11def-builder-probes-switching-vlans
