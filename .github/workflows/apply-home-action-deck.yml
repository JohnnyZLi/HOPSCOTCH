name: Apply Lab 10C home actions

on:
  push:
    branches: [agent/lab-10c-home-actions]
    paths:
      - scripts/apply-home-action-deck.py
      - .github/workflows/apply-home-action-deck.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lab-10c-home-actions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply action-first overview integration
        run: python3 scripts/apply-home-action-deck.py
      - run: npm ci
      - run: npm run check
      - run: npm run performance:check
      - name: Remove one-shot integration scaffolding
        run: rm scripts/apply-home-action-deck.py .github/workflows/apply-home-action-deck.yml
      - name: Commit integrated overview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/styles.css src/ExploreLauncher.css src/HomeActionDeck.tsx src/HomeActionDeck.css scripts/home-action-deck-contract-check.mjs package.json docs/ROADMAP.md scripts/apply-home-action-deck.py .github/workflows/apply-home-action-deck.yml
          git commit -m "Integrate action-first HOPSCOTCH overview"
          git push origin HEAD:agent/lab-10c-home-actions
