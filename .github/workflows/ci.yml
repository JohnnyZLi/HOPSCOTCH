name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lab-09f-loopback-bridge
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply Lab 09F bridge browser coverage
        run: python3 scripts/apply-lab09f-browser.py
      - run: npm ci
      - run: npm run check
      - name: Validate Lab 09F bridge flow in production Chrome
        env:
          HOPSCOTCH_GPU_MODE: default
          HOPSCOTCH_REPORT_PATH: artifacts/lab09f-bridge-compatibility.json
        run: npm run compatibility:chrome
      - name: Commit validated Lab 09F bridge coverage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/performance-profile.mjs
          git rm -f --ignore-unmatch scripts/apply-lab09f-browser.py
          git diff --cached --quiet && exit 0
          git commit -m "Audit Lab 09F loopback bridge browser flow"
          git push origin HEAD:agent/lab-09f-loopback-bridge
