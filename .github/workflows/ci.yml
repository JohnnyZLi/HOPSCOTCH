name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/track-c-enterprise-depth
          fetch-depth: 0
      - name: Apply Track C integration once
        run: |
          if [ -f scripts/track-c-integrate.py ]; then
            python - <<'PY'
          from pathlib import Path
          p=Path('scripts/track-c-integrate.py')
          text=p.read_text()
          start=text.index("replace_once('src/builder/ethernet.ts',\n\"    summary:")
          end=text.index("\n\n# STP config gains", start)
          p.write_text(text[:start]+text[end:])
          PY
            python scripts/track-c-integrate.py
            python scripts/track-c-stp-fix.py
            python scripts/track-c-summary-fix.py
            git config user.name "Johnny"
            git config user.email "92900710+JohnnyZLi@users.noreply.github.com"
            git add src/builder/ethernet.ts src/builder/stp.ts src/BuilderAuthoringPanelContent.tsx package.json
            git commit -m "Track C: integrate enterprise truth into Builder"
            git push origin HEAD:agent/track-c-enterprise-depth
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Upload production build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hopscotch-dist
          path: dist
          if-no-files-found: error
          retention-days: 3
