name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lab-08c-browser-gpu-compatibility
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply validated Lab 08C candidates
        run: |
          python3 scripts/apply-lab08c.py
          python3 scripts/apply-lab08c-firefox.py
      - run: npm run check
      - name: Validate Chrome compatibility modes
        run: |
          HOPSCOTCH_GPU_MODE=default HOPSCOTCH_REPORT_PATH=artifacts/compatibility-default.json node scripts/performance-profile.mjs --compatibility
          HOPSCOTCH_GPU_MODE=swiftshader HOPSCOTCH_REPORT_PATH=artifacts/compatibility-swiftshader.json node scripts/performance-profile.mjs --compatibility
          HOPSCOTCH_GPU_MODE=disabled HOPSCOTCH_REPORT_PATH=artifacts/compatibility-disabled.json node scripts/performance-profile.mjs --compatibility
      - name: Validate Firefox compatibility
        run: node scripts/firefox-compatibility.mjs
      - name: Finalize permanent Lab 08C source
        run: python3 scripts/finalize-lab08c.py
      - name: Export finalized Lab 08C source
        uses: actions/upload-artifact@v4
        with:
          name: hopscotch-lab08c-finalized-source
          path: |
            scripts/performance-profile.mjs
            scripts/firefox-compatibility.mjs
            package.json
            .github/workflows/compatibility.yml
            .github/workflows/ci.yml
          if-no-files-found: error
          retention-days: 3
