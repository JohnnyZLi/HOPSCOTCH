name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply Track J DNS + transport slice once
        run: |
          if grep -q "service-hostname-missing" src/builder/challenges.ts; then
            echo "Track J DNS/transport slice already applied."
          else
            python scripts/apply-track-j-dns-transport.py
          fi
          python scripts/fix-track-j-dns-protocol-events.py
      - run: npm ci
      - run: npm run check
      - name: Commit generated product changes
        run: |
          if git diff --quiet; then
            echo "No generated product changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/builder/application.ts src/builder/scenario.ts src/builder/scenario-compare.ts src/builder/authoring.ts src/BuilderApplicationPanel.tsx src/BuilderApplicationWorkspace.tsx src/BuilderApplicationPanel.css src/builder/device-workbench.ts src/builder/challenges.ts src/BuilderChallengePanel.tsx src/NetworkBuilder.tsx scripts/builder-application-contract-check.mjs scripts/builder-challenge-contract-check.mjs scripts/builder-addressing-contract-check.mjs docs/TRACKJ.md
          git commit -m "Add DNS and transport troubleshooting challenges"
          git push origin HEAD:${{ github.head_ref }}
