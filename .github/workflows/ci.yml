name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply integrated product hardening once
        run: |
          if grep -q "Integrated product hardening after Tracks A–L" docs/ROADMAP.md; then
            echo "Integrated product hardening already applied."
          else
            python scripts/apply-integrated-product-hardening.py
          fi
      - run: npm ci
      - run: npm run check
      - name: Commit integrated product hardening
        run: |
          if git diff --quiet; then
            echo "No generated product changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/App.tsx src/main.tsx src/styles.css src/lab.css src/tcp.css src/dns.css src/JourneyTheater.css src/ExploreLauncher.css src/visual-audit.css src/tcp-audit.css src/dns-audit.css src/journey-audit.css package.json docs/ROADMAP.md README.md
          git commit -m "Integrate post-track product hardening"
          git push origin HEAD:${{ github.head_ref }}
