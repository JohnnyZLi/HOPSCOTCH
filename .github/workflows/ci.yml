name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lab-09a-native-provenance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: git fetch origin main
      - name: Restore main roadmap and apply only Lab 09A checkbox
        run: python3 scripts/restore-lab09a-roadmap.py
      - run: npm ci
      - run: npm run check
      - name: Commit precise Lab 09A roadmap change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ROADMAP.md
          git rm -f --ignore-unmatch scripts/restore-lab09a-roadmap.py
          git diff --cached --quiet && exit 0
          git commit -m "Repair Lab 09A roadmap scope"
          git push origin HEAD:agent/lab-09a-native-provenance
