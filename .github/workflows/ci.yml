name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/track-c-enterprise-depth
          fetch-depth: 0
      - name: Apply Track C lazy boundary once
        run: |
          if [ -f scripts/track-c-lazy-boundary.py ]; then
            python scripts/track-c-lazy-boundary.py
            git config user.name "Johnny"
            git config user.email "92900710+JohnnyZLi@users.noreply.github.com"
            git add src/builder/ethernet.ts src/builder/stp.ts src/builder/enterprise.ts scripts/builder-enterprise-contract-check.mjs
            git commit -m "Track C: isolate enterprise algorithms behind lazy boundary"
            git push origin HEAD:agent/track-c-enterprise-depth
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Upload production build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hopscotch-dist
          path: dist
          if-no-files-found: error
          retention-days: 3
