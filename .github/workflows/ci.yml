name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lab-09e-measured-sidecars
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply Lab 09E shared-doc sync
        run: python3 scripts/sync-lab09e-docs.py
      - run: npm ci
      - run: npm run check
      - name: Commit validated Lab 09E shared docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/ROADMAP.md docs/ARCHITECTURE.md
          git rm -f --ignore-unmatch scripts/sync-lab09e-docs.py
          git diff --cached --quiet && exit 0
          git commit -m "Sync Lab 09E shared docs"
          git push origin HEAD:agent/lab-09e-measured-sidecars
