name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/track-f-routing-policy-depth
          fetch-depth: 0
      - name: Apply Track F contract fixture fix once
        run: |
          if [ -f scripts/track-f-contract-fixture-fix.mjs ]; then
            node scripts/track-f-contract-fixture-fix.mjs
            git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            git commit -m "Track F: use documentation ASNs in contract"
            git push origin agent/track-f-routing-policy-depth
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Upload production build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hopscotch-dist
          path: dist
          if-no-files-found: error
          retention-days: 3
