name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lab-09d-measured-workspace
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply Lab 09D header polish
        run: python3 scripts/apply-lab09d-header-copy.py
      - run: npm ci
      - run: npm run check
      - name: Validate polished measured workspace in production Chrome
        env:
          HOPSCOTCH_GPU_MODE: default
          HOPSCOTCH_REPORT_PATH: artifacts/lab09d-header-compatibility.json
        run: npm run compatibility:chrome
      - name: Commit validated Lab 09D header polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx scripts/measured-workspace-contract-check.mjs docs/LAB09D.md
          git rm -f --ignore-unmatch scripts/apply-lab09d-header-copy.py
          git diff --cached --quiet && exit 0
          git commit -m "Polish Lab 09D mobile header"
          git push origin HEAD:agent/lab-09d-measured-workspace
