name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply Track J ACL/NAT slice once
        run: |
          if grep -q "'acl-deny'" src/builder/challenges.ts; then
            echo "Track J ACL/NAT slice already applied."
          else
            node scripts/fix-track-j-policy-patcher.mjs
            node scripts/apply-track-j-policy-slice.mjs
          fi
      - run: npm ci
      - run: npm run check
      - name: Commit generated product changes
        run: |
          if git diff --quiet src/builder/challenges.ts src/BuilderChallengePanel.tsx src/BuilderNatPanel.tsx src/NetworkBuilder.tsx scripts/builder-challenge-contract-check.mjs docs/TRACKJ.md; then
            echo "No generated product changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/builder/challenges.ts src/BuilderChallengePanel.tsx src/BuilderNatPanel.tsx src/NetworkBuilder.tsx scripts/builder-challenge-contract-check.mjs docs/TRACKJ.md
          git commit -m "Add ACL and NAT troubleshooting challenges"
          git push origin HEAD:${{ github.head_ref }}
