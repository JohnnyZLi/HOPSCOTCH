name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply UI stability fixes once
        run: |
          if grep -q "max(206px" src/styles.css; then
            echo "UI stability fixes already applied."
          else
            python scripts/apply-ui-stability-fixes.py
          fi
      - run: npm ci
      - run: npm run check
      - name: Commit UI stability fixes
        run: |
          if git diff --quiet; then
            echo "No generated UI changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/styles.css src/JourneyTheater.css package.json
          git commit -m "Fix overview and Journey layout stability"
          git push origin HEAD:${{ github.head_ref }}
