name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply Track J multi-fault closeout once
        run: |
          if grep -q "createComposedChallenge" src/builder/challenges.ts; then
            echo "Track J closeout patch already applied."
          else
            python scripts/apply-track-j-multifault-closeout.py
          fi
      - run: npm ci
      - run: npm run check
      - name: Commit generated product changes
        run: |
          if git diff --quiet; then
            echo "No generated product changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/ROADMAP.md docs/TRACKJ.md scripts/builder-challenge-contract-check.mjs src/BuilderChallengePanel.tsx src/NetworkBuilder.tsx src/builder/challenges.ts
          git commit -m "Close Track J with bounded multi-fault challenges"
          git push origin HEAD:${{ github.head_ref }}
