name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Refresh Track J DNS + transport documentation
        run: python scripts/fix-track-j-dns-docs.py
      - name: Commit documentation cleanup
        run: |
          if git diff --quiet docs/TRACKJ.md; then
            echo "No documentation changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/TRACKJ.md
          git commit -m "Refresh Track J DNS and transport docs"
          git push origin HEAD:${{ github.head_ref }}
