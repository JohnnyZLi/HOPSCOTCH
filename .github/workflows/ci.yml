name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply Track J BGP policy slice once
        run: |
          if grep -q "bgp-import-deny" src/builder/challenges.ts; then
            echo "Track J BGP policy slice already applied."
          else
            python scripts/apply-track-j-bgp-policy.py
          fi
          python scripts/fix-track-j-bgp-focus.py
      - run: npm ci
      - run: npm run check
      - name: Commit generated product changes
        run: |
          if git diff --quiet; then
            echo "No generated product changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/TRACKJ.md scripts/builder-challenge-contract-check.mjs src/BuilderChallengePanel.tsx src/NetworkBuilder.tsx src/builder/challenges.ts src/builder/device-workbench.ts
          git commit -m "Add BGP import-policy troubleshooting challenge"
          git push origin HEAD:${{ github.head_ref }}
