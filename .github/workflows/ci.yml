name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply Track L closeout once
        run: |
          if grep -q "BuilderExplainPanel" src/NetworkBuilder.tsx; then
            echo "Track L integration already applied."
          else
            python scripts/apply-track-l-closeout.py
          fi
      - run: npm ci
      - run: npm run check
      - name: Commit generated Track L closeout
        run: |
          if git diff --quiet; then
            echo "No generated product changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/NetworkBuilder.tsx src/builder/explain.ts package.json docs/ROADMAP.md
          git commit -m "Integrate Track L closeout"
          git push origin HEAD:${{ github.head_ref }}
