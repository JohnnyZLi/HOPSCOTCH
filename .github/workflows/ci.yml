name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply scale inspector flyout once
        run: |
          if grep -q "className=\"scale-inspector\"" src/App.tsx; then
            echo "Scale inspector already applied."
          else
            python scripts/apply-scale-inspector-flyout.py
          fi
      - run: npm ci
      - run: npm run check
      - name: Capture scale inspector review
        run: node scripts/capture-scale-inspector-review.mjs
      - name: Upload scale inspector review
        uses: actions/upload-artifact@v4
        with:
          name: scale-inspector-review
          path: artifacts/scale-inspector-review
          if-no-files-found: error
          retention-days: 3
      - name: Commit scale inspector flyout
        run: |
          if git diff --quiet; then
            echo "No generated scale inspector changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/App.tsx src/styles.css scripts/ui-stability-contract-check.mjs
          git commit -m "Attach scale explanation to active rail row"
          git push origin HEAD:${{ github.head_ref }}
      - name: Upload production build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hopscotch-dist
          path: dist
          if-no-files-found: error
          retention-days: 3
