name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lab-07h-partition-unreachable
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Clarify stalled TCP delivery state
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/JourneyTheaterV2.tsx')
          text = path.read_text()
          old = "<strong>{quic ? (state.tls === 'application-keys' ? '1-RTT' : state.tls === 'handshake-keys' ? 'HANDSHAKE' : 'INITIAL') : complete ? 'CUMULATIVELY ACKED' : established ? 'BYTE STREAM READY' : 'HANDSHAKE'}</strong>"
          new = "<strong>{quic ? (state.tls === 'application-keys' ? '1-RTT' : state.tls === 'handshake-keys' ? 'HANDSHAKE' : 'INITIAL') : stalled ? 'NO IP PROGRESS' : complete ? 'CUMULATIVELY ACKED' : established ? 'BYTE STREAM READY' : 'HANDSHAKE'}</strong>"
          if old not in text:
              raise SystemExit('stalled TCP delivery label anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: npm ci
      - run: npm run check
      - name: Upload production build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hopscotch-dist
          path: dist
          if-no-files-found: error
          retention-days: 3
      - name: Commit validated stalled-state clarification
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/lab-07h-partition-unreachable'
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "HOPSCOTCH Agent"
          git config user.email "actions@users.noreply.github.com"
          git add src/JourneyTheaterV2.tsx .github/workflows/ci.yml
          git commit -m "Clarify stalled TCP delivery during partition"
          git push origin HEAD:agent/lab-07h-partition-unreachable
