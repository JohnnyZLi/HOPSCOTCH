name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/track-b-authoring-closeout
          fetch-depth: 0
      - name: Remove authoring lazy adapter once
        run: |
          if [ -f scripts/track-b-direct-lazy.py ]; then
            python scripts/track-b-direct-lazy.py
            git config user.name "Johnny"
            git config user.email "92900710+JohnnyZLi@users.noreply.github.com"
            git add src/NetworkBuilder.tsx src/BuilderAuthoringPanel.tsx scripts/builder-authoring-contract-check.mjs
            git commit -m "Track B: lazy-load authoring shell directly"
            git push origin HEAD:agent/track-b-authoring-closeout
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Upload production build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hopscotch-dist
          path: dist
          if-no-files-found: error
          retention-days: 3
