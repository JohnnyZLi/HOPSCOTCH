name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Enforce high-severity dependency audit
        run: npm audit --audit-level=high
      - name: Verify production governance contract
        run: node scripts/production-governance-contract.mjs
      - run: npm run check
      - name: Verify DNS actor-anchor geometry
        id: dns-geometry
        run: node scripts/dns-workspace-geometry-review.mjs
      - name: Upload DNS geometry review
        if: always() && steps.dns-geometry.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: hopscotch-dns-workspace-geometry-review
          path: artifacts/dns-workspace-geometry-review
          if-no-files-found: error
          retention-days: 7
      - name: Upload production build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hopscotch-dist
          path: dist
          if-no-files-found: error
          retention-days: 3
