name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lab-09c-network-diagnostics-ingestion
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply Lab 09C validated fixes
        run: python3 scripts/apply-lab09c-fixes.py
      - run: npm ci
      - run: npm run check
      - name: Commit Lab 09C source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/measurement/networkDiagnosticsAdapter.ts scripts/network-diagnostics-ingestion-contract-check.mjs
          git rm -f --ignore-unmatch scripts/apply-lab09c-fixes.py
          git diff --cached --quiet && exit 0
          git commit -m "Tighten Lab 09C ingestion privacy"
          git push origin HEAD:agent/lab-09c-network-diagnostics-ingestion
