name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lab-09d-measured-workspace
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply Lab 09D app candidate
        run: python3 scripts/apply-lab09d-app.py
      - run: npm ci
      - run: npm run check
      - name: Commit validated Lab 09D app integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git rm -f --ignore-unmatch scripts/apply-lab09d-app.py
          git diff --cached --quiet && exit 0
          git commit -m "Integrate Lab 09D measured workspace"
          git push origin HEAD:agent/lab-09d-measured-workspace
