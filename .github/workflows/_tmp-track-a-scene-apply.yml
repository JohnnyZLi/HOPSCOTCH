name: Temporary Track A synchronized scene

on:
  push:
    branches:
      - agent/track-a-synchronized-scene
    paths:
      - scripts/_tmp_apply_track_a_scene.py
      - .github/workflows/_tmp-track-a-scene-apply.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/track-a-synchronized-scene
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply synchronized historical scene
        run: python3 scripts/_tmp_apply_track_a_scene.py
      - name: Correct generated scene wrapper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/NetworkBuilder.tsx')
          text = path.read_text()
          bad = "data-link-count={graph.links.length}\""
          if bad not in text:
              raise SystemExit('expected generated wrapper marker not found')
          path.write_text(text.replace(bad, "data-link-count={graph.links.length}", 1))
          PY
      - name: Remove temporary patch machinery
        run: rm scripts/_tmp_apply_track_a_scene.py .github/workflows/_tmp-track-a-scene-apply.yml
      - name: Install locked dependencies
        run: npm ci
      - name: Dedicated timeline contract
        run: npm run test:builder-timeline-contract
      - name: Full repository check
        run: npm run check
      - name: Enforced performance profile
        run: npm run performance:check
      - name: Chrome production compatibility
        run: npm run compatibility:chrome
      - name: Commit validated implementation
        run: |
          git config user.name "Johnny"
          git config user.email "92900710+JohnnyZLi@users.noreply.github.com"
          git add -A
          git commit -m "Track A: synchronize the full Builder scene"
          git push origin HEAD:agent/track-a-synchronized-scene
