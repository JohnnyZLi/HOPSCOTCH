name: Performance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  production-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/sync-lab08a-shared-docs.py
      - run: npm ci
      - run: npm run build
      - run: npm run performance:check
      - name: Upload performance profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hopscotch-performance-profile
          path: artifacts/performance-profile.json
          if-no-files-found: error
          retention-days: 3
      - name: Upload validated Lab 08A docs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hopscotch-lab08a-docs
          path: |
            docs/ROADMAP.md
            docs/ARCHITECTURE.md
          if-no-files-found: error
          retention-days: 1
