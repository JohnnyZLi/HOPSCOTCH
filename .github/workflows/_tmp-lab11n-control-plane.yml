name: Temp Lab 11N Control Plane

on:
  push:
    branches: [agent/lab-11n-ipv6-control-plane]

permissions:
  contents: write

jobs:
  apply-model:
    if: "!contains(github.event.head_commit.message, '[lab11n-model-applied]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lab-11n-ipv6-control-plane
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/_tmp_patch_ipv6_model.py
      - run: npm ci
      - run: npm run typecheck
      - name: Commit model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/builder/ipv6.ts
          git commit -m "Lab 11N: add RA SLAAC and OSPFv3 model [lab11n-model-applied]"
          git push origin HEAD:agent/lab-11n-ipv6-control-plane
