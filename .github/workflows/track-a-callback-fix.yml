name: Track A callback fix

on:
  push:
    branches:
      - agent/track-a-closeout
    paths:
      - .github/workflows/track-a-callback-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/track-a-closeout
          fetch-depth: 0
      - name: Restore bounded transaction callback
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/NetworkBuilder.tsx')
          s=p.read_text()
          old='onTransaction={setApplicationHistory}'
          new='onTransaction={(transaction)=>setApplicationHistory((current)=>[...current,transaction].slice(-24))}'
          if old not in s:
              raise SystemExit('Track A callback marker missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix
        run: |
          git config user.name "Johnny"
          git config user.email "92900710+JohnnyZLi@users.noreply.github.com"
          git add src/NetworkBuilder.tsx
          git commit -m "Track A: restore bounded transaction callback"
          git push origin HEAD:agent/track-a-closeout
