name: Restore semantic scene choreography

on:
  push:
    branches:
      - agent/lab07-route-failure

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lab07-route-failure
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/restore-semantic-scene-choreography.mjs
      - name: Commit source restore
        run: |
          if git diff --quiet; then
            echo "No source changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/JourneyTheaterV2.tsx
          git commit -m "Restore Journey semantic scene choreography"
          git push origin HEAD:agent/lab07-route-failure
