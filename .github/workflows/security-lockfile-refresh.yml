name: Security lockfile refresh

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'fix/npm-security-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Resolve the first Wrangler release beyond the vulnerable range
        run: npm install --save-dev wrangler@4.131.0 --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit npm-authored dependency files
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Bump Wrangler past vulnerable Sharp chain"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
