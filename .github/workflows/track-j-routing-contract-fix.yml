name: Track J routing contract fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/track-j-routing-ospf-challenges'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/track-j-routing-ospf-challenges
      - name: Canonicalize static-route contract comparison
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/builder-challenge-contract-check.mjs')
          text=path.read_text()
          old="assert.deepEqual(restoredStatic, staticRoute.healthy.routing, 'static challenge removes exactly one required canonical route');"
          new="assert.deepEqual([...restoredStatic.staticRoutes].sort((a,b)=>a.id.localeCompare(b.id)), [...staticRoute.healthy.routing.staticRoutes].sort((a,b)=>a.id.localeCompare(b.id)), 'static challenge removes exactly one required canonical route independent of route-list insertion order');\nassert.deepEqual({ ...restoredStatic, staticRoutes: [] }, { ...staticRoute.healthy.routing, staticRoutes: [] }, 'static repair leaves all non-route routing configuration unchanged');"
          if text.count(old)!=1: raise SystemExit('Expected static route assertion once')
          path.write_text(text.replace(old,new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/builder-challenge-contract-check.mjs
          git commit -m "Canonicalize static challenge repair contract"
          git push origin HEAD:agent/track-j-routing-ospf-challenges
