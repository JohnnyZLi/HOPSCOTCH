name: Labs 11D-F production browser audit v3

on:
  push:
    branches:
      - agent/lab-11def-builder-probes-switching-vlans

permissions:
  contents: write

jobs:
  audit:
    if: ${{ github.event.head_commit.message != 'Add permanent Labs 11D-F browser contract' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lab-11def-builder-probes-switching-vlans
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply and exercise Builder browser contract
        run: |
          sed -n "/python3 - <<'PY'/,/^          PY$/p" .github/workflows/lab11def-browser-audit.yml \
            | sed '1d;$d;s/^          //' > /tmp/lab11def-browser-patch.py
          python3 /tmp/lab11def-browser-patch.py
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/performance-profile.mjs')
          text=path.read_text()
          if text.count("new FocusEvent('blur',{bubbles:true})") != 2:
              raise SystemExit('expected two synthetic blur events')
          path.write_text(text.replace("new FocusEvent('blur',{bubbles:true})", "new FocusEvent('focusout',{bubbles:true})"))
          PY
          npm ci
          npm run check
          mkdir -p artifacts
          HOPSCOTCH_REPORT_PATH=artifacts/lab11def-browser-audit.json npm run compatibility:chrome
      - name: Commit permanent browser contract
        run: |
          rm .github/workflows/lab11def-browser-audit.yml .github/workflows/lab11def-browser-audit-v2.yml .github/workflows/lab11def-browser-audit-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add permanent Labs 11D-F browser contract"
          git push origin HEAD:agent/lab-11def-builder-probes-switching-vlans
      - name: Upload exact-artifact audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab11def-builder-depth-audit-v3
          path: |
            artifacts/lab11def-browser-audit.json
            artifacts/builder-depth-*.png
            artifacts/builder-ospf-*.png
          if-no-files-found: warn
          retention-days: 3
