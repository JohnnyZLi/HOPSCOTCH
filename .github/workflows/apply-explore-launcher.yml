name: Apply Explore launcher

on:
  push:
    branches:
      - agent/lab-10a-explore-launcher
    paths:
      - scripts/apply-explore-launcher.py
      - .github/workflows/apply-explore-launcher.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lab-10a-explore-launcher
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply bounded App integration
        run: python3 scripts/apply-explore-launcher.py
      - run: npm ci
      - run: npm run check
      - name: Remove one-shot integration scaffolding
        run: rm scripts/apply-explore-launcher.py .github/workflows/apply-explore-launcher.yml
      - name: Commit integrated launcher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/ExploreLauncher.tsx src/ExploreLauncher.css scripts/explore-launcher-contract-check.mjs package.json docs/ROADMAP.md scripts/apply-explore-launcher.py .github/workflows/apply-explore-launcher.yml
          git commit -m "Integrate HOPSCOTCH Explore launcher"
          git push origin HEAD:agent/lab-10a-explore-launcher
