name: Sync Lab 07 roadmap

on:
  push:
    branches:
      - agent/sync-lab07ab-roadmap

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/sync-lab07ab-roadmap
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/sync-lab07-roadmap.mjs
      - name: Commit roadmap
        run: |
          if git diff --quiet; then
            echo "No roadmap changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ROADMAP.md
          git commit -m "Sync roadmap through Lab 07B"
          git push origin HEAD:agent/sync-lab07ab-roadmap
