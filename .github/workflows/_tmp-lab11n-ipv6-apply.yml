name: Temp Lab 11N IPv6 Apply

on:
  push:
    branches: [agent/lab-11n-ipv6-foundation]

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[lab11n-ipv6-applied]')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lab-11n-ipv6-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/_tmp_apply_lab11n_ipv6.py
      - run: npm ci
      - run: npm run check
      - name: Commit applied implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts package.json docs
          git commit -m "Lab 11N: add IPv6 dual-stack foundation [lab11n-ipv6-applied]"
          git push origin HEAD:agent/lab-11n-ipv6-foundation
