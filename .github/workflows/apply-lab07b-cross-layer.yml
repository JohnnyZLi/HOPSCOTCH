name: Apply Lab 07B cross-layer codemod

on:
  push:
    branches:
      - agent/lab07-route-failure

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lab07-route-failure
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply codemod
        run: node scripts/apply-lab07b-cross-layer.mjs
      - name: Commit generated source changes
        run: |
          if git diff --quiet; then
            echo "No source changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/JourneyTheaterV2.tsx src/journey/scenario.ts src/journey/browser.ts package.json
          git commit -m "Wire Lab 07B route failure across Journey UI and sharing"
          git push origin HEAD:agent/lab07-route-failure
