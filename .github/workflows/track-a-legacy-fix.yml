name: Track A legacy history compatibility

on:
  push:
    branches:
      - agent/track-a-closeout
    paths:
      - .github/workflows/track-a-legacy-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/track-a-closeout
      - name: Make application history backward-safe
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/builder/canonical-events.ts')
          s=p.read_text()
          old="""  const priorIds=new Set(before.applicationHistory.map((transaction)=>transaction.id));
            const transactions=after.applicationHistory.filter((transaction)=>!priorIds.has(transaction.id));"""
          new="""  const priorIds=new Set((before.applicationHistory??[]).map((transaction)=>transaction.id));
            const transactions=(after.applicationHistory??[]).filter((transaction)=>!priorIds.has(transaction.id));"""
          if old not in s:
              raise SystemExit('legacy application-history marker not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix
        run: |
          git config user.name "Johnny"
          git config user.email "92900710+JohnnyZLi@users.noreply.github.com"
          git add src/builder/canonical-events.ts
          git commit -m "Track A: preserve legacy event fixtures"
          git push origin HEAD:agent/track-a-closeout
