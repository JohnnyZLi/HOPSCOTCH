              ...commonFields,
              { id: 'tcp-seq', label: 'Sequence', value: '0x1A2B3C4D', offset: 4, length: 4 },
              { id: 'tcp-ack', label: 'Acknowledgment', value: '0x55667788', offset: 8, length: 4 },
