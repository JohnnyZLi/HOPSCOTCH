name: Agent Site Editorial Imports
on:
  push:
    branches: [agent/site-editorial-light-system]
permissions:
  contents: write
jobs:
  patch-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/site-editorial-light-system
      - name: Add lazy editorial imports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          edits = {
            'src/NetworkBuilder.tsx': ("import './NetworkBuilder.phase3.css';", "import './NetworkBuilder.phase3.css';\nimport './NetworkBuilderEditorialLight.css';"),
            'src/PacketMicroscope.tsx': ("import './packet.phase3.css';", "import './packet.phase3.css';\nimport './PacketMicroscopeEditorialLight.css';"),
            'src/CaptureReplayWorkspace.tsx': ("import './CaptureReplayWorkspace.phase4.css';", "import './CaptureReplayWorkspace.phase4.css';\nimport './CaptureReplayEditorialLight.css';"),
            'src/MeasuredNetworkWorkspace.tsx': ("import './MeasuredNetworkWorkspace.phase4.css';", "import './MeasuredNetworkWorkspace.phase4.css';\nimport './MeasuredNetworkEditorialLight.css';"),
            'src/InternetScaleTheater.tsx': ("import './InternetScaleTheater.phase3.css';", "import './InternetScaleTheater.phase3.css';\nimport './InternetScaleEditorialLight.css';"),
            'src/ObservedInternet.tsx': ("import './ObservedInternet.phase4.css';", "import './ObservedInternet.phase4.css';\nimport './ObservedInternetEditorialLight.css';"),
          }
          for path, (needle, replacement) in edits.items():
            p = Path(path)
            text = p.read_text()
            if replacement in text:
              continue
            if needle not in text:
              raise SystemExit(f'missing import anchor in {path}')
            p.write_text(text.replace(needle, replacement, 1))
          PY
      - name: Commit imports
        shell: bash
        run: |
          git config user.name "Johnny"
          git config user.email "92900710+JohnnyZLi@users.noreply.github.com"
          git add src/NetworkBuilder.tsx src/PacketMicroscope.tsx src/CaptureReplayWorkspace.tsx src/MeasuredNetworkWorkspace.tsx src/InternetScaleTheater.tsx src/ObservedInternet.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Load editorial styles with lazy workspaces"
          git push origin HEAD:agent/site-editorial-light-system
