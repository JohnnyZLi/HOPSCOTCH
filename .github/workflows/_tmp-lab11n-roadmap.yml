name: Temp Lab 11N Roadmap

on:
  push:
    branches: [agent/lab-11n-ipv6-control-plane]

permissions:
  contents: write

jobs:
  finalize:
    if: "!contains(github.event.head_commit.message, '[lab11n-roadmap-finalized]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lab-11n-ipv6-control-plane
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Mark completed IPv6 roadmap slices
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/ROADMAP.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '- [ ] Neighbor Discovery replaces ARP for IPv6 next-hop resolution': '- [x] Neighbor Discovery replaces ARP for IPv6 next-hop resolution',
              '- [ ] Router Solicitation / Router Advertisement and SLAAC host bootstrap': '- [x] Router Solicitation / Router Advertisement and SLAAC host bootstrap',
              '- [ ] ICMPv6 control behavior including Packet Too Big / path-MTU discovery': '- [x] ICMPv6 control behavior including Packet Too Big / path-MTU discovery',
              '- [ ] OSPFv3 integration after the IPv6 forwarding model is stable': '- [x] OSPFv3 Area 0 integration with link-local adjacencies and failure reconvergence',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one roadmap anchor: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run check
      - run: npm run performance:check
      - run: npm run compatibility:chrome
      - name: Commit roadmap and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/_tmp-lab11n-roadmap.yml
          git add -A
          git commit -m "Lab 11N: complete IPv6 control-plane roadmap [lab11n-roadmap-finalized]"
          git push origin HEAD:agent/lab-11n-ipv6-control-plane
