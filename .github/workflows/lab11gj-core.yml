name: Labs 11G-J core integration

on:
  push:
    branches:
      - agent/lab-11g-j-arp-stp-links-acl

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ github.event.head_commit.message != 'Integrate Labs 11G-J core models' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lab-11g-j-arp-stp-links-acl
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply core integration
        run: |
          python3 scripts/lab11gj-integrate.py
          sed -i 's/BuilderScenarioV6/BuilderScenarioV7/g' src/NetworkBuilder.tsx
          sed -i 's/\.version, 6)/.version, 7)/g; s/schema-v6/schema-v7/g; s/schema v6/schema v7/g' scripts/builder-addressing-contract-check.mjs scripts/builder-ospf-contract-check.mjs scripts/high-density-contract-check.mjs
          npm ci
          npm run check
      - name: Commit core integration
        run: |
          rm .github/workflows/lab11gj-core.yml scripts/lab11gj-integrate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate Labs 11G-J core models"
          git push origin HEAD:agent/lab-11g-j-arp-stp-links-acl
