name: Track A canonical event patch

on:
  push:
    branches:
      - agent/track-a-canonical-event-timeline

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/track-a-canonical-event-timeline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply Track A implementation
        run: |
          base64 -d scripts/track-a-canonical-event-patch.mjs.gz.b64 | gunzip > /tmp/track-a-canonical-event-patch.mjs
          node --check /tmp/track-a-canonical-event-patch.mjs
          node /tmp/track-a-canonical-event-patch.mjs
      - run: npm ci
      - run: npm run test:builder-canonical-events-contract
      - run: npm run test:builder-timeline-contract
      - run: npm run check
      - run: npm run performance:check
      - run: npm run compatibility:chrome
      - name: Commit implementation
        run: |
          rm -f scripts/track-a-canonical-event-patch.mjs.gz.b64 .github/workflows/track-a-canonical-events-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Track A: add canonical event timeline"
          git push origin HEAD:agent/track-a-canonical-event-timeline
