          path = Path('src/NetworkBuilder.css')
          text = path.read_text() + '''\n.builder-ethernet-stage{display:grid;gap:6px;padding:13px 18px 16px;border-top:1px solid rgba(255,255,255,.075);background:rgba(82,190,255,.03)}.builder-ethernet-stage>span{color:#5c89a4;font-size:.5rem;font-weight:850;letter-spacing:.13em}.builder-ethernet-stage>strong{color:#ccecff;font-size:.8rem;letter-spacing:.025em}.builder-ethernet-stage>p{margin:0;color:#75848d;font-size:.64rem;line-height:1.42}.builder-ethernet-stage>small{color:#57646c;font-size:.44rem;letter-spacing:.055em}.builder-ethernet-stage.failed>strong{color:#ff9b9b}.builder-lan-canvas{position:relative;height:230px;margin-top:4px;border:1px solid rgba(82,190,255,.1);border-radius:6px;background:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:24px 24px;overflow:hidden}.builder-lan-canvas svg{position:absolute;inset:0;width:100%;height:100%}.builder-lan-canvas line{stroke:rgba(108,139,157,.4);stroke-width:1.15;vector-effect:non-scaling-stroke}.builder-lan-canvas g.flow line{stroke:#52beff;stroke-width:2.1;filter:drop-shadow(0 0 4px rgba(82,190,255,.35))}.builder-lan-canvas g.failed line{stroke:#e76b6b;stroke-dasharray:3 2}.builder-lan-canvas text{fill:#648092;font-size:2.7px;font-weight:850;paint-order:stroke;stroke:#071017;stroke-width:.55px}.builder-lan-node{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;gap:1px;min-width:58px;padding:6px 8px;border:1px solid rgba(82,190,255,.2);border-radius:5px;background:#081018}.builder-lan-node.endpoint{border-radius:17px}.builder-lan-node.switch{border-color:rgba(255,211,106,.26)}.builder-lan-node.router{border-color:rgba(198,156,255,.28)}.builder-lan-node span{font-size:.4rem;color:#5d7180;font-weight:900;letter-spacing:.12em}.builder-lan-node strong{font-size:.58rem;color:#d9e7ee}.builder-lan-node small{font-size:.39rem;color:#668497}.builder-lan-phases{display:flex;gap:5px;overflow:auto}.builder-lan-phases>span{flex:1 1 0;display:grid;gap:2px;min-width:190px;padding:7px;border:1px solid rgba(82,190,255,.1);border-radius:4px;color:#667b87;font-size:.43rem}.builder-lan-phases b{color:#89ccec;font-size:.47rem}.builder-ethernet-section{border-color:rgba(82,190,255,.18)!important}.builder-fdb{display:grid;gap:4px;padding:7px;border:1px solid rgba(255,211,106,.1);border-radius:4px}.builder-fdb>span{color:#9b8146;font-size:.44rem;font-weight:900;letter-spacing:.1em}.builder-fdb small{display:grid;grid-template-columns:80px 1fr;color:#69757b;font:500 .42rem ui-monospace,SFMono-Regular,Menlo,monospace}.builder-fdb b{color:#c5a95f}@media(max-width:560px){.builder-lan-canvas{height:210px}.builder-lan-node{min-width:48px;padding:5px}.builder-lan-node strong{font-size:.5rem}.builder-lan-phases{display:grid}.builder-lan-phases>span{min-width:0}}\n'''
          path.write_text(text)

          # Update affected Builder contracts from scenario v5 to v6 and validate Ethernet persistence separately.
          for filename in ['scripts/builder-addressing-contract-check.mjs','scripts/builder-ospf-contract-check.mjs','scripts/high-density-contract-check.mjs']:
            path = Path(filename); text = path.read_text()
            text = text.replace('version, 5', 'version, 6').replace('version,5', 'version,6').replace('schema-v5','schema-v6').replace('schema v5','schema v6')
            text = text.replace("assert.equal(scenario.version, 5);", "assert.equal(scenario.version, 6);")
            path.write_text(text)

          # Add explicit schema-v6 Ethernet persistence contract.
          path = Path('scripts/builder-ethernet-contract-check.mjs')
          text = path.read_text()
          text = text.replace("import { createDefaultBuilderEthernetConfig,", "import { createDefaultBuilderEthernetConfig,")
          text = text.replace("from '../src/builder/ethernet.ts';", "from '../src/builder/ethernet.ts';\nimport { createDefaultBuilderAddressing } from '../src/builder/addressing.ts';\nimport { defaultBuilderGraph, defaultBuilderLayout } from '../src/builder/model.ts';\nimport { createDefaultBuilderRoutingConfig } from '../src/builder/routing.ts';\nimport { createBuilderScenario, deserializeBuilderScenario, serializeBuilderScenario } from '../src/builder/scenario.ts';")
          text = text.replace("console.log('Builder Ethernet/VLAN contract passed", "const scenario=createBuilderScenario('LAN persisted',defaultBuilderGraph,'client','app',defaultBuilderLayout,createDefaultBuilderAddressing(defaultBuilderGraph),createDefaultBuilderRoutingConfig(),undefined,fabric);\nassert.equal(scenario.version,6);\nconst restored=deserializeBuilderScenario(serializeBuilderScenario(scenario));\nassert.deepEqual(restored.ethernet.links.find((link)=>link.id==='lan-sw1-sw2')?.allowedVlans,[10,20]);\nconst legacyV5={...scenario,version:5}; delete legacyV5.ethernet;\nconst migrated=deserializeBuilderScenario(JSON.stringify(legacyV5));\nassert.equal(migrated.version,6); assert.equal(migrated.ethernet.devices.length,0,'legacy routed scenarios migrate without silently fabricating a LAN');\n\nconsole.log('Builder Ethernet/VLAN contract passed")
          path.write_text(text)

          # package check.
          path=Path('package.json'); pkg=json.loads(path.read_text()); pkg['scripts']['test:builder-ethernet-contract']='node scripts/builder-ethernet-contract-check.mjs'
          needle='npm run test:builder-probes-contract && '
          if needle not in pkg['scripts']['check']: raise SystemExit('package probes check marker missing')
          pkg['scripts']['check']=pkg['scripts']['check'].replace(needle,needle+'npm run test:builder-ethernet-contract && ')
          path.write_text(json.dumps(pkg,indent=2)+'\n')

          # Roadmap 11E/11F.
          path=Path('docs/ROADMAP.md'); text=path.read_text(); marker='## Performance + rendering — ongoing'
          block='''### 11E — Ethernet LANs + switching foundation\n- [x] add a bounded Layer-2 fabric with endpoint, switch, and router device roles inside Network Builder\n- [x] keep Ethernet/LAN truth separate from the existing routed point-to-point /30 graph instead of silently reinterpreting old links\n- [x] explicit access-port VLAN membership and link-up/down state\n- [x] deterministic VLAN-scoped MAC learning/FDB derivation from each flow\n- [x] unknown-unicast flood-and-learn teaching state followed by learned unicast return\n- [x] same-VLAN forwarding stays Layer 2 and leaves IP TTL unchanged\n- [x] Layer-2 path search permits switches as transit while endpoints/routers remain edge devices\n- [x] permanent Ethernet switching contract wired into `npm run check`\n\n### 11F — VLANs, trunks + inter-VLAN routing\n- [x] VLAN IDs 1–4094 with named IPv4 broadcast domains\n- [x] explicit trunk mode with bounded allowed-VLAN lists; endpoints cannot become trunk ports\n- [x] trunk filtering can isolate one VLAN without breaking another VLAN carried on the same physical link\n- [x] router-on-a-stick device owns explicit per-VLAN IPv4 interfaces\n- [x] endpoint gateways must match the router interface used for inter-VLAN forwarding\n- [x] inter-VLAN flow is two Layer-2 segments separated by one routed hop and one TTL decrement\n- [x] switch FDB state remains keyed by switch + VLAN + MAC\n- [x] Builder scenario schema v6 persists LAN/VLAN configuration while derived FDB/flow observations remain session-only\n- [x] v1–v5 routed scenarios migrate to v6 with an empty LAN fabric rather than fabricated Layer-2 state\n- [x] permanent VLAN/trunk/inter-VLAN contract wired into `npm run check`\n\n'''
          if marker not in text: raise SystemExit('roadmap marker missing')
          text=text.replace(marker,block+marker); path.write_text(text)
          PY

          npm ci
          npm run check
