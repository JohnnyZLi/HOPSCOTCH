name: Temp Lab 11N Finalize

on:
  push:
    branches: [agent/lab-11n-ipv6-control-plane]

permissions:
  contents: write

jobs:
  validate:
    if: "!contains(github.event.head_commit.message, '[lab11n-finalized]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lab-11n-ipv6-control-plane
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/_tmp_patch_ipv6_packet_support.py
      - run: python3 scripts/_tmp_patch_ipv6_panel_plumbing.py
      - run: python3 scripts/_tmp_patch_ipv6_panel_handlers.py
      - run: python3 scripts/_tmp_patch_ipv6_panel_nd.py
      - run: python3 scripts/_tmp_patch_ipv6_panel_pmtu.py
      - run: python3 scripts/_tmp_patch_ipv6_panel_ospfv3.py
      - run: python3 scripts/_tmp_fix_ipv6_network_order.py
      - run: python3 scripts/_tmp_patch_ipv6_network.py
      - run: npm ci
      - run: npm run check
      - run: npm run performance:check
      - run: npm run compatibility:chrome
      - name: Commit validated implementation and remove temporary patch machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f \
            scripts/_tmp_fix_ipv6_network_order.py \
            scripts/_tmp_patch_ipv6_model.py \
            scripts/_tmp_patch_ipv6_network.py \
            scripts/_tmp_patch_ipv6_package.py \
            scripts/_tmp_patch_ipv6_packet_support.py \
            scripts/_tmp_patch_ipv6_panel_handlers.py \
            scripts/_tmp_patch_ipv6_panel_nd.py \
            scripts/_tmp_patch_ipv6_panel_ospfv3.py \
            scripts/_tmp_patch_ipv6_panel_plumbing.py \
            scripts/_tmp_patch_ipv6_panel_pmtu.py \
            .github/workflows/_tmp-lab11n-validate.yml
          git add -A
          git commit -m "Lab 11N: finalize IPv6 ND, SLAAC, PMTU, and OSPFv3 [lab11n-finalized]"
          git push origin HEAD:agent/lab-11n-ipv6-control-plane
