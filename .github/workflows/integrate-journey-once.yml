name: Integrate Journey once

on:
  push:
    branches: [agent/lab06-url-journey]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lab06-url-journey
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/integrate-journey-app-once.mjs
      - name: Commit integrated App
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          if git diff --cached --quiet; then
            echo "App is already integrated."
            exit 0
          fi
          git commit -m "Integrate URL Journey into App"
          git push origin HEAD:agent/lab06-url-journey
