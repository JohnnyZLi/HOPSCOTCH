              "  const detectingLoss = state.activeEvent.kind === 'transport.loss-detected';\n  const latencySelected = state.modifierIds.includes('latency-spike');",
              "  const detectingLoss = state.activeEvent.kind === 'transport.loss-detected';\n  const outageDetection = detectingLoss && state.activeEvent.id.includes('outage');\n  const latencySelected = state.modifierIds.includes('latency-spike');",
          )
          old_panel = '''    {detectingLoss ? <div className="loss-transport-panel">
      {quic ? <><div><span>ACK RANGES</span><strong>4105–4107 · 4109–4112</strong></div><div className="loss-gap"><span>MISSING PACKET</span><strong>PN 4108</strong></div><div><span>STREAM GAP</span><strong>4096–5555</strong></div></> : <><div><span>RECEIVE NEXT</span><strong>2461</strong></div><div className="loss-gap"><span>DUPLICATE ACK</span><strong>ACK 2461 × 3</strong></div><div><span>MISSING RANGE</span><strong>SEQ 2461–3920</strong></div></>}
    </div> : <div className="sequence-state">'''
          new_panel = '''    {detectingLoss ? <div className="loss-transport-panel">
      {outageDetection ? (quic ? <><div><span>ACK PROGRESS</span><strong>STALLED</strong></div><div className="loss-gap"><span>PTO</span><strong>{state.transportMetrics?.timerMs ?? '—'} ms</strong></div><div><span>ROUTE</span><strong>{state.routeMetrics?.activePath?.toUpperCase() ?? 'NONE'}</strong></div></> : <><div><span>ACK PROGRESS</span><strong>SILENT</strong></div><div className="loss-gap"><span>RTO</span><strong>{state.transportMetrics?.timerMs ?? '—'} ms</strong></div><div><span>RECOVERY</span><strong>RETRANSMIT AFTER ROUTE</strong></div></>) : quic ? <><div><span>ACK RANGES</span><strong>4105–4107 · 4109–4112</strong></div><div className="loss-gap"><span>MISSING PACKET</span><strong>PN 4108</strong></div><div><span>STREAM GAP</span><strong>4096–5555</strong></div></> : <><div><span>RECEIVE NEXT</span><strong>2461</strong></div><div className="loss-gap"><span>DUPLICATE ACK</span><strong>ACK 2461 × 3</strong></div><div><span>MISSING RANGE</span><strong>SEQ 2461–3920</strong></div></>}
    </div> : <div className="sequence-state">'''
          replace('src/JourneyTheaterV2.tsx', old_panel, new_panel)

          replace(
              'src/JourneyTheaterV2.tsx',
              "    setModifierIds((current) => current.includes(modifierId) ? current.filter((id) => id !== modifierId) : [...current, modifierId]);",
              "    setModifierIds((current) => {\n      if (current.includes(modifierId)) return current.filter((id) => id !== modifierId);\n      const incompatible = modifierId === 'route-failure' ? 'path-outage' : modifierId === 'path-outage' ? 'route-failure' : null;\n      return [...current.filter((id) => id !== incompatible), modifierId];\n    });",
          )
          replace(
              'src/JourneyTheaterV2.tsx',
              "  const routeSelected = selectedModifiers.includes('route-failure');\n  const lossSelected = selectedModifiers.includes('single-loss');\n  const latencySelected = selectedModifiers.includes('latency-spike');",
              "  const preRouteSelected = selectedModifiers.includes('route-failure');\n  const outageSelected = selectedModifiers.includes('path-outage');\n  const routeSelected = preRouteSelected || outageSelected;\n  const lossSelected = selectedModifiers.includes('single-loss');\n  const latencySelected = selectedModifiers.includes('latency-spike');",
          )
          old_buttons = '''<div className="journey-profile journey-impairment-profile journey-modifier-profile" role="group" aria-label="GOD MODE modifiers"><button type="button" className={selectedModifiers.length===0?'active':''} aria-pressed={selectedModifiers.length===0} onClick={clearModifiers}>CLEAN</button><button type="button" className={lossSelected?'active':''} aria-pressed={lossSelected} onClick={()=>toggleModifier('single-loss')}>LOSS</button><button type="button" className={latencySelected?'active':''} aria-pressed={latencySelected} onClick={()=>toggleModifier('latency-spike')}>LATENCY</button><button type="button" className={routeSelected?'active':''} aria-pressed={routeSelected} onClick={()=>toggleModifier('route-failure')}>ROUTE</button></div>'''
          new_buttons = '''<div className="journey-profile journey-impairment-profile journey-modifier-profile" role="group" aria-label="GOD MODE modifiers"><button type="button" className={selectedModifiers.length===0?'active':''} aria-pressed={selectedModifiers.length===0} onClick={clearModifiers}>CLEAN</button><button type="button" className={lossSelected?'active':''} aria-pressed={lossSelected} onClick={()=>toggleModifier('single-loss')}>LOSS</button><button type="button" className={latencySelected?'active':''} aria-pressed={latencySelected} onClick={()=>toggleModifier('latency-spike')}>LATENCY</button><button type="button" className={preRouteSelected?'active':''} aria-pressed={preRouteSelected} onClick={()=>toggleModifier('route-failure')}>ROUTE</button><button type="button" className={outageSelected?'active':''} aria-pressed={outageSelected} onClick={()=>toggleModifier('path-outage')}>OUTAGE</button></div>'''
          replace('src/JourneyTheaterV2.tsx', old_buttons, new_buttons)
          replace(
              'src/JourneyTheaterV2.tsx',
              "<strong className={lossSelected||latencySelected?toneClass:''}>{transportStateLabel}</strong>",
              "<strong className={lossSelected||latencySelected||outageSelected?toneClass:''}>{transportStateLabel}</strong>",
