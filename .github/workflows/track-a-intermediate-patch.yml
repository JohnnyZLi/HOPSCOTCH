name: Track A intermediate history patch

on:
  push:
    branches:
      - agent/track-a-canonical-event-timeline

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/track-a-canonical-event-timeline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply intermediate truth projection
        run: |
          node --check scripts/track-a-intermediate-patch.mjs
          node scripts/track-a-intermediate-patch.mjs
      - name: Preserve canonical same-time OSPF ordering
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          function replaceOnce(path,before,after){
            const text=readFileSync(path,'utf8');
            if(!text.includes(before)) throw new Error(`Missing alignment anchor in ${path}`);
            writeFileSync(path,text.replace(before,after));
          }
          replaceOnce(
            'src/builder/canonical-events.ts',
            "if (kind === 'ADJACENCY_DOWN') return { control: 'after' };",
            "if (kind === 'DEAD_TIMER_EXPIRED') return { control: 'after' };",
          );
          replaceOnce(
            'src/builder/canonical-events.ts',
            "  return output\n    .filter((entry, index, all) => all.findIndex((candidate) => candidate.key === entry.key) === index)\n    .sort((a, b) => (a.offsetMs ?? 0) - (b.offsetMs ?? 0) || (a.key ?? '').localeCompare(b.key ?? ''))\n    .slice(0, 120);",
            "  const unique = output.filter((entry, index, all) => all.findIndex((candidate) => candidate.key === entry.key) === index);\n  return unique\n    .map((entry,index)=>({entry,index}))\n    .sort((a,b)=>(a.entry.offsetMs??0)-(b.entry.offsetMs??0)||a.index-b.index)\n    .map(({entry})=>entry)\n    .slice(0,120);",
          );
          replaceOnce(
            'scripts/builder-canonical-events-contract-check.mjs',
            "assert.equal(helloSnapshot.state,deadSnapshot.state,'dead-timer expiry alone must not allocate a duplicate scene state');\nassert.equal(failed(adjacencySnapshot.state.truthGraphs.controlGraph),true,'ADJACENCY DOWN must advance control-plane truth to the failed topology');\nassert.equal(failed(adjacencySnapshot.state.truthGraphs.ribGraph),false,'RIB must still be stale after control-plane convergence begins');",
            "assert.equal(dead.atMs,40000+action.atMs,'dead timer remains at the canonical Lab 11M boundary');\nconst adjacency=journal.find((event)=>event.summary==='OSPF · ADJACENCY DOWN');\nassert.ok(adjacency);\nassert.equal(adjacency.atMs,dead.atMs,'dead expiry and adjacency down occur at the same model instant');\nassert.ok(dead.sequence<adjacency.sequence,'same-time canonical events must preserve Lab 11M emission order instead of sorting lexically by key');\nassert.equal(failed(deadSnapshot.state.truthGraphs.controlGraph),true,'DEAD TIMER EXPIRED must advance control-plane truth at the exact Lab 11M model boundary');\nassert.equal(failed(deadSnapshot.state.truthGraphs.ribGraph),false,'RIB must remain stale when the dead timer expires');\nassert.equal(deadSnapshot.state,adjacencySnapshot.state,'ADJACENCY DOWN occurs at the same model instant and should share the control-plane snapshot');\nassert.equal(failed(adjacencySnapshot.state.truthGraphs.ribGraph),false,'RIB must still be stale after the adjacency leaves FULL');",
          );
          replaceOnce(
            'docs/TRACKA.md',
            'ADJACENCY DOWN advances control-plane truth; RIB UPDATED advances route selection while the FIB is still stale;',
            'DEAD TIMER EXPIRED advances control-plane truth and the same-instant ADJACENCY DOWN event observes that state; RIB UPDATED advances route selection while the FIB is still stale;',
          );
          NODE
      - run: npm ci
      - run: npm run test:builder-canonical-events-contract
      - run: npm run test:builder-timeline-contract
      - run: npm run check
      - run: npm run performance:check
      - run: npm run compatibility:chrome
      - name: Commit implementation
        run: |
          rm -f scripts/track-a-intermediate-patch.mjs .github/workflows/track-a-intermediate-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Track A: project intermediate OSPF truth"
          git push origin HEAD:agent/track-a-canonical-event-timeline
