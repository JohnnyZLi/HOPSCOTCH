name: Track A temporary cleanup

on:
  push:
    branches:
      - agent/track-a-closeout
    paths:
      - .github/workflows/track-a-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/track-a-closeout
          fetch-depth: 0
      - name: Remove one-shot Track A scaffolding
        run: |
          git rm -f \
            .github/workflows/track-a-cleanup.yml \
            .github/workflows/track-a-closeout-patch.yml \
            .github/workflows/track-a-legacy-fix.yml \
            scripts/track-a-closeout-patch.mjs \
            docs/TRACKA-CLOSEOUT-NOTES.md \
            docs/TRACKA-CLOSEOUT-PR.md \
            docs/TRACKA-CLOSEOUT-STATUS.md \
            docs/.track-a-pr-ready \
            docs/.track-a-pr-open \
            docs/.track-a-create-pr \
            docs/.track-a-stop
      - name: Commit cleanup
        run: |
          git config user.name "Johnny"
          git config user.email "92900710+JohnnyZLi@users.noreply.github.com"
          git commit -m "Track A: remove temporary closeout scaffolding"
          git push origin HEAD:agent/track-a-closeout
