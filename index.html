<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f5f7" />
    <script>
      (() => {
        let appearance = 'light';
        try {
          const saved = localStorage.getItem('hopscotch.appearance');
          if (['light', 'dark', 'system'].includes(saved)) appearance = saved;
        } catch {}
        const theme = appearance === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : appearance;
        document.documentElement.dataset.design = 'reviewed';
        document.documentElement.dataset.appearance = appearance;
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#171a20' : '#f3f5f7';
      })();
    </script>
    <meta
      name="description"
      content="HOPSCOTCH — an interactive, animated exploration of networks and Internet protocols."
    />
    <link rel="icon" type="image/svg+xml" href="/hopscotch.svg" />
    <title>HOPSCOTCH — See the Internet happen</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
