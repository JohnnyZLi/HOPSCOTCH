<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f5f7" />
    <meta
      name="description"
      content="HOPSCOTCH — an interactive, animated exploration of networks and Internet protocols."
    />
    <link rel="icon" type="image/svg+xml" href="/hopscotch.svg" />
    <script>try{const p=localStorage.getItem("hopscotch.appearance")||"light";document.documentElement.dataset.appearance=p;document.documentElement.dataset.theme=p==="system"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):p;}catch{document.documentElement.dataset.theme="light";}</script>
    <title>HOPSCOTCH — See the Internet happen</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
